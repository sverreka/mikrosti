  let yourTxt='';
  if(!ok){
    if(q.t==='mc') yourTxt=q.o[+L.sel]; else if(q.t==='tf') yourTxt=L.sel==='1'?'True':'False'; else yourTxt=esc(L.sel);

    ${ok?`<p>${q.e}</p>${steps.length?`<button class="more" id="more" aria-expanded="false">Show full solution</button><div id="solbox" hidden>${sol}</div>`:''}`
       :`<div class="cmp"><div><span>Your answer</span>${yourTxt}</div><div><span>Correct answer</span>${ansTxt}</div></div>${steps.length?sol:`<p>${q.e}</p>`}`}
    <button class="rep" id="repq" type="button">Something wrong with this question? Report it</button></div><button class="btn" id="cont">${ok?'Continue':'Got it, continue'}</button>`;
  const m=document.getElementById('more'); if(m) m.onclick=()=>{const b=document.getElementById('solbox');b.hidden=!b.hidden;m.setAttribute('aria-expanded',!b.hidden);m.textContent=b.hidden?'Show full solution':'Hide solution';};
  document.getElementById('repq').onclick=()=>openReport(q);
  const c=document.getElementById('cont'); c.onclick=next; c.focus();
}

function examPanel(){
  if(!S.examDate || editExam){
    return `<div class="exam">${CAL}<div class="tx"><b>When is your exam?</b><small>Set the date to get a countdown and a daily plan.</small><br><label for="exDate" style="position:absolute;left:-9999px">Exam date</label><input type="date" id="exDate" min="${today()}" value="${S.examDate||''}"></div><button class="link" id="exSave">Save</button></div>`;
  }
  const days=dayDiff(today(),S.examDate), left=remainingWork();
  const nice=new Date(S.examDate+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long'});
  let head, sub;
  if(days<0){ head='Your exam date has passed'; sub='Set a new date for your next exam.'; }
  else if(days===0){ head='Exam day! Good luck'; sub='You’ve got this. Skim the formulas one last time.'; }
  else {
    head=`${days} day${days===1?'':'s'} until the exam`;
    sub= left===0 ? `${nice} · Everything is done. Keep doing practice exams.` : `${nice} · About ${Math.ceil(left/days)} lesson${Math.ceil(left/days)===1?'':'s'} a day to finish everything (${left} left)`;
  }
  return `<div class="exam">${CAL}<div class="tx"><b>${head}</b><small>${sub}</small></div><button class="link" id="exEdit">Change</button></div>`;
}
function bindExam(el){
  const sv=el.querySelector('#exSave'), ed=el.querySelector('#exEdit');
  if(sv) sv.onclick=()=>{ const v=el.querySelector('#exDate').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){el.querySelector('#exDate').focus();return;} S.examDate=v; editExam=false; save(); show('sti'); };
  if(ed) ed.onclick=()=>{ editExam=true; show('sti'); setTimeout(()=>{const i=document.getElementById('exDate'); i&&i.focus();},30); };
}

// ---------- Report a problem ----------
function stripHtml(h){ const t=document.createElement('div'); t.innerHTML=String(h).replace(/<sub>(.*?)<\/sub>/g,'_$1').replace(/<sup>(.*?)<\/sup>/g,'^$1'); return t.textContent.replace(/\s+/g,' ').trim(); }
function closeModal(){ document.getElementById('modal').innerHTML=''; const c=document.getElementById('cont'); if(c) c.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('modal').innerHTML){ e.stopImmediatePropagation(); closeModal(); } },true);
function openReport(q){
  const cloud=window.MikroCloud||{};
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rtitle"><div class="card pop">
    <div class="row"><div><div class="qtag">Report a problem</div><h2 id="rtitle">What’s wrong?</h2></div><button class="x" id="rclose" aria-label="Close">${ICON.x}</button></div>
    <div class="rchips">${['The answer is wrong','The question is unclear','Typo or formatting','The solution is wrong'].map(t=>`<button type="button" class="chip" aria-pressed="false">${t}</button>`).join('')}</div>
    <label for="rmsg" style="font-weight:800;font-size:.85rem">Details (optional)</label>
    <textarea id="rmsg" class="rtext" maxlength="900" placeholder="E.g. I think the answer should be 40 because …"></textarea>
    <p class="amsg" id="rstat" role="status"></p>
    <button class="btn" id="rsend">Send report</button></div></div>`;
  const chips=[...m.querySelectorAll('.chip')];
  chips.forEach(c=>c.onclick=()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true'));
  m.querySelector('.sheet').addEventListener('click',e=>{ if(e.target.classList.contains('sheet')) closeModal(); });
  document.getElementById('rclose').onclick=closeModal;
  document.getElementById('rsend').onclick=async()=>{
    const picked=chips.filter(c=>c.getAttribute('aria-pressed')==='true').map(c=>c.textContent);
    const msg=[picked.join(', '),document.getElementById('rmsg').value.trim()].filter(Boolean).join(': ');
    const st=document.getElementById('rstat'), b=document.getElementById('rsend');
    if(msg.length<3){ st.className='amsg err'; st.textContent='Pick a reason or write a few words.'; return; }
    if(!cloud.report){ st.className='amsg err'; st.textContent='Reports only work on the online version of the site.'; return; }
    b.disabled=true; b.textContent='Sending …';
    const qt=stripHtml(q.q)+(q.t==='mc'?' | Options: '+q.o.map(stripHtml).join(' / '):'')+' | App answer: '+stripHtml(q.t==='mc'?q.o[q.a]:q.t==='tf'?(q.a?'True':'False'):String(q.a));
    try{ await cloud.report(q.id, qt.slice(0,1990), msg.slice(0,1000)); st.className='amsg ok'; st.textContent='Thanks! The report has been sent.'; b.textContent='Sent'; setTimeout(closeModal,1200); }
    catch(err){ st.className='amsg err'; st.textContent='Could not send the report. Try again in a bit.'; b.disabled=false; b.textContent='Send report'; }
  };
}

// ---------- Weekly leaderboard ----------
async function viewBoard(el){
  const cloud=window.MikroCloud||{}, wk=isoWeek(new Date());
  el.innerHTML=`<div class="panel"><h2>This week’s leaderboard</h2><p>XP earned this week (${wk.replace('-W',', week ')}). Resets every Monday.</p><div id="lbList"><p class="empty">Loading …</p></div><div id="lbMe"></div></div>`;
  const list=el.querySelector('#lbList'), me=el.querySelector('#lbMe');
  if(!cloud.ready){ list.innerHTML='<p class="empty">The leaderboard is only available on the online version of the site.</p>'; return; }
  const user=cloud.user();
  // your own status
  if(!user){
    me.innerHTML=`<p style="margin-top:14px">You have <b>${weekXp()} XP</b> this week. Log in to join the leaderboard.</p><button class="btn" id="lbLogin">Log in to join</button>`;
    me.querySelector('#lbLogin').onclick=()=>cloud.login();
  } else if(!(S.lb&&S.lb.on)){
    const def=(cloud.displayName()||'').split(/\s+/)[0].slice(0,20);
    me.innerHTML=`<p style="margin-top:14px;color:var(--ink);font-weight:700">Join with a nickname. Only the nickname and your XP this week are shown.</p>
      <div class="lbjoin"><label for="lbName" style="position:absolute;left:-9999px">Nickname</label><input id="lbName" maxlength="20" value="${esc(def)}" placeholder="Nickname"><button class="btn" id="lbJoin">Join</button></div><p class="amsg" id="lbStat"></p>`;
    me.querySelector('#lbJoin').onclick=async()=>{
      const n=me.querySelector('#lbName').value.trim(), st=me.querySelector('#lbStat');
      if(n.length<2){ st.className='amsg err'; st.textContent='The nickname needs at least 2 characters.'; return; }
      S.lb={on:true,name:n}; if(S.wk!==wk){S.wk=wk;S.wkXp=0;} save();
      try{ await cloud.syncBoard(S); show('board'); }catch(e){ S.lb={on:false}; save(); st.className='amsg err'; st.textContent=/duplicate|unique/i.test(e.message||'')?'That nickname is taken.':'Could not join right now. Try again in a bit.'; }
    };
  } else {
    me.innerHTML=`<p style="margin-top:14px">You’re on the leaderboard as <b>${esc(S.lb.name)}</b> with <b>${weekXp()} XP</b> this week. <button class="link" id="lbLeave">Leave the leaderboard</button></p>`;
    me.querySelector('#lbLeave').onclick=async()=>{ S.lb={on:false}; save(); try{ await cloud.leaveBoard(); }catch(e){} show('board'); };
  }
  try{
    const rows=await cloud.board(wk);
    if(currentView!=='board') return;
    list.innerHTML=rows.length?`<ol class="board">${rows.map((r,i)=>`<li class="${user&&r.user_id===user.id?'me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(r.nickname)}</span><span class="xp">${r.xp} XP</span></li>`).join('')}</ol>`
      :'<p class="empty">Nobody has earned XP this week yet. Be the first!</p>';
  }catch(e){ list.innerHTML='<p class="empty">Could not load the leaderboard. Check your connection.</p>'; }
}

// Keyboard: 1–4 selects, Enter checks/continues
document.addEventListener('keydown',e=>{
  if(document.getElementById('modal').innerHTML || document.body.classList.contains('show-auth')) return;
  if(!L) { if(e.key==='Escape') document.getElementById('overlay').innerHTML=''; return; }
  if(e.key==='Escape'){document.getElementById('lx')?.click();return;}
  if(L.state==='ask' && /^[1-4]$/.test(e.key) && document.activeElement?.id!=='numA'){document.getElementById('o'+(+e.key-1))?.click();}
  if(e.key==='Enter'){e.preventDefault();
    // One Enter = one step: ignore a held-down key and presses that come too fast after the last one
    if(e.repeat) return; const now=Date.now(); if(now-(window.__lastEnter||0)<400) return; window.__lastEnter=now;
    if(L.state==='ask') check(); else { const c=document.getElementById('cont'); if(c) c.click(); else document.getElementById('rdone')?.click(); } }
});

hud(); save();
const h0=location.hash.slice(1);
show(['sti','eksamen','feil','formler','board'].includes(h0)?h0:'sti');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==currentView&&['sti','eksamen','feil','formler','board'].includes(h))show(h);});
};
</script>
<script>
// ---------- Accounts and cloud progress (Supabase) ----------
(function(){
const CFG=window.MIKRO_CONFIG||{};
const BASE='mikrosti-se213-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const configured=/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(CFG.supabaseUrl||'') && CFG.supabaseAnonKey && !/^YOUR/.test(CFG.supabaseAnonKey);
const recovering=/type=recovery/.test(location.hash);
let sb=null, user=null, started=false, guest=false, mode='login';
function openAuth(m){ setMode(m||'login'); document.body.classList.add('show-auth'); setTimeout(()=>{ const f=m==='reset'?$('aPass'):$('aEmail'); f&&f.focus(); },30); }
function closeAuth(){ document.body.classList.remove('show-auth'); }
function startGuest(){ if(started) return; started=true; guest=true; window.startMikroApp(); }
$('aClose').onclick=()=>{ closeAuth(); if(mode==='reset'||mode==='retry') location.reload(); };
$('auth').addEventListener('click',e=>{ if(e.target.id==='auth' && mode!=='reset') closeAuth(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.body.classList.contains('show-auth') && mode!=='reset'){ e.stopImmediatePropagation(); closeAuth(); } },true);
let pending=null, saving=false, timer=null, lastRemote=null, status='ok';

function msg(t,kind){ const m=$('amsg'); m.textContent=t||''; m.className='amsg'+(kind?' '+kind:''); }
function busy(on,label){ const b=$('abtn'); b.disabled=on; if(label) b.textContent=label; }
const LABEL={login:'Log in',signup:'Create account',forgot:'Send reset link',reset:'Save new password'};
function setMode(m){
  mode=m; msg('');
  $('atabs').hidden=(m==='forgot'||m==='reset');
  $('atabs').querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.mode===m));
  $('gWrap').hidden=!(CFG.googleLogin && (m==='login'||m==='signup'));
  $('fName').hidden=m!=='signup';
  $('fEmail').hidden=m==='reset';
  $('fPass').hidden=m==='forgot';
  $('aPass').autocomplete=(m==='signup'||m==='reset')?'new-password':'current-password';
  $('aForgot').hidden=m!=='login';
  $('aBack').hidden=!(m==='forgot'||m==='reset');
  $('atag').textContent={login:'Log in to save your progress and continue on any device.',signup:'Create a free account. The progress you already have here comes with you.',forgot:'Enter your email and we’ll send you a link to choose a new password.',reset:'Choose a new password for your account.'}[m];
  busy(false,LABEL[m]);
}
$('atabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));
$('aForgot').onclick=()=>setMode('forgot');
$('aGoogle').onclick=async()=>{
  if(!sb) return; busy(true); msg('');
  const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error){ msg(niceError(error),'err'); busy(false,LABEL[mode]); }
};
$('aBack').onclick=()=>setMode('login');

function niceError(e){
  const m=(e&&e.message)||String(e);
  if(/invalid login credentials/i.test(m)) return 'Wrong email or password.';
  if(/email not confirmed/i.test(m)) return 'Confirm your email first. Check your inbox for the link.';
  if(/already registered|already exists/i.test(m)) return 'There is already an account with this email. Log in instead.';
  if(/password should be at least/i.test(m)) return 'The password must be at least 6 characters.';
  if(/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a minute and try again.';
  if(/failed to fetch|network/i.test(m)) return 'Could not reach the server. Check your connection.';
  return m;
}

$('aform').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!sb) return;
  if(mode==='retry') return location.reload();
  const email=$('aEmail').value.trim(), pass=$('aPass').value, name=$('aName').value.trim();
  if(mode!=='reset' && !/^\S+@\S+\.\S+$/.test(email)) return msg('Enter a valid email address.','err');
  if(mode!=='forgot' && pass.length<6) return msg('The password must be at least 6 characters.','err');
  const back=document.location.origin+document.location.pathname;
  busy(true,'Please wait …'); msg('');
  try{
    if(mode==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error;
    } else if(mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name||email.split('@')[0]},emailRedirectTo:back}});
      if(error) throw error;
      if(data.user && data.user.identities && data.user.identities.length===0) throw new Error('already registered');
      if(!data.session){ setMode('login'); $('aEmail').value=email; msg('Account created! Check your email and click the confirmation link, then log in.','ok'); return; }
    } else if(mode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error) throw error;
      msg('If that email has an account, a reset link is on its way.','ok'); busy(false,LABEL[mode]); return;
    } else if(mode==='reset'){
      const {error}=await sb.auth.updateUser({password:pass}); if(error) throw error;
      location.replace(location.pathname); return;
    }
  }catch(err){ msg(niceError(err),'err'); busy(false,LABEL[mode]); }
});

// --- Progress: load once at login, then save (debounced) on every change ---
async function fetchRemote(){
  const {data,error}=await sb.from('progress').select('data,updated_at').eq('user_id',user.id).maybeSingle();
  if(error) throw error; return data;
}
function readLocal(key){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } }

async function enter(u){
  if(started) return; started=true; user=u;
  busy(true,'Loading your progress …'); msg('');
  let remote;
  try{ remote=await fetchRemote(); }
  catch(err){
    console.error(err); user=null; started=false; startGuest(); openAuth('login');
    msg(/relation|does not exist|schema cache/i.test(err.message||'')?'The database table is missing. Run supabase/schema.sql in the Supabase SQL editor.':niceError(err),'err');
    mode='retry'; busy(false,'Try again');
    ['atabs','fName','fEmail','fPass','aForgot','aBack'].forEach(id=>$(id).hidden=true);
    return;
  }
  const mine=readLocal(BASE+':'+u.id), legacy=readLocal(BASE);
  const rd=remote&&remote.data&&Object.keys(remote.data).length?remote.data:null;
  let initial=rd;
  if(mine && (!rd || (mine._t||0)>(rd._t||0))) initial=mine;   // this device has newer, unsynced progress
  if(!initial && legacy) initial=legacy;                       // progress from before accounts existed
  lastRemote=remote?remote.updated_at:null;
  window.MIKRO_UID=u.id; window.MIKRO_INITIAL=initial;
  document.body.classList.add('authed'); closeAuth(); $('acct').classList.remove('guest'); $('acct').setAttribute('aria-label','Account and sync');
  const nm=window.MikroCloud.displayName()||'?';
  $('acct').firstChild.textContent=nm.trim().charAt(0).toUpperCase();
  if(history.replaceState && /access_token|type=/.test(location.hash)) history.replaceState(null,'',location.pathname);
  window.startMikroApp();   // calls save() once, which uploads the starting state
}

function setStatus(s){ status=s; const d=$('syncDot'); d.className=s==='ok'?'':s; const t=$('syncTxt'); if(t) t.textContent=statusText(); }
function statusText(){ return status==='ok'?'All progress saved to your account.':status==='saving'?'Saving …':'Couldn’t save just now. Retrying automatically. Your progress is kept on this device meanwhile.'; }

window.cloudSave=function(state){
  if(!user) return;
  pending=JSON.parse(JSON.stringify(state)); setStatus('saving');
  clearTimeout(timer); timer=setTimeout(flush,1200);
};
async function flush(){
  clearTimeout(timer);
  if(!pending||saving||!user) return;
  saving=true; const body=pending; pending=null;
  try{
    const {data,error}=await sb.from('progress').upsert({user_id:user.id,data:body},{onConflict:'user_id'}).select('updated_at').single();
    if(error) throw error;
    lastRemote=data.updated_at;
    if(body.lb && body.lb.on) await syncBoard(body);
    if(!pending) setStatus('ok');
  }catch(err){
    console.warn('Sync failed',err); if(!pending) pending=body; setStatus('err'); timer=setTimeout(flush,6000);
  }finally{ saving=false; if(pending && status!=='err'){ timer=setTimeout(flush,300); } }
}
async function syncBoard(state){
  if(!user || !state.lb || !state.lb.on || !state.wk) return;
  const {error}=await sb.from('leaderboard').upsert({user_id:user.id,nickname:String(state.lb.name).slice(0,20),week:state.wk,xp:Math.min(20000,state.wkXp||0),updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error) throw error;
}
window.MikroCloud={
  ready:false,
  user:()=>user,
  displayName:()=>user?((user.user_metadata&&(user.user_metadata.display_name||user.user_metadata.full_name||user.user_metadata.name))||user.email.split('@')[0]):'',
  login:()=>openAuth('login'),
  report:async(qid,qtext,message)=>{ const {error}=await sb.from('question_reports').insert({question_id:qid,question_text:qtext,message}); if(error) throw error; },
  board:async(week)=>{ const {data,error}=await sb.from('leaderboard').select('user_id,nickname,xp').eq('week',week).order('xp',{ascending:false}).limit(25); if(error) throw error; return data; },
  syncBoard:syncBoard,
  leaveBoard:async()=>{ if(!user) return; const {error}=await sb.from('leaderboard').delete().eq('user_id',user.id); if(error) throw error; }
};
// Save right away when the tab is hidden; reload if another device saved newer progress
document.addEventListener('visibilitychange',async()=>{
  if(!user) return;
  if(document.visibilityState==='hidden'){ flush(); return; }
  if(pending||saving) return;
  try{ const r=await fetchRemote(); if(r && lastRemote && r.updated_at!==lastRemote && !pending && !saving && !document.querySelector('.lesson')) location.reload(); }catch(e){}
});
window.addEventListener('pagehide',()=>flush());

// --- Account sheet ---
$('acct').addEventListener('click',()=>{
  if(!user){ openAuth('login'); return; }
  const ov=$('overlay'); const nm=window.MikroCloud.displayName();
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="actitle"><div class="card pop">
    <div class="row"><div><div class="qtag">Account</div><h2 id="actitle">${esc(nm||user.email)}</h2></div><button class="x" id="acclose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" width="26" height="26"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p style="color:var(--muted);margin:10px 0 4px">${esc(user.email)}</p>
    <p id="syncTxt" style="font-weight:700;margin:4px 0 14px">${statusText()}</p>
    <button class="btn ghost" id="aclogout">Log out</button>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap"><a href="privacy.html" style="color:var(--muted);font-weight:700;font-size:.85rem">Privacy</a><button class="link" id="acdel" style="color:var(--bad)">Delete account</button></div>
    <div id="acdelbox" hidden><p style="color:var(--ink);font-weight:700;margin:10px 0 6px">This permanently deletes your account, your progress and your leaderboard entry. It can’t be undone.</p><p class="amsg" id="acdelmsg"></p><button class="btn danger" id="acdelyes">Yes, delete everything</button></div></div></div>`;
  const close=()=>ov.innerHTML='';
  ov.querySelector('.sheet').addEventListener('click',e=>{if(e.target.classList.contains('sheet'))close();});
  $('acclose').onclick=close;
  $('acdel').onclick=()=>{ $('acdelbox').hidden=false; $('acdel').hidden=true; $('acdelyes').focus(); };
  $('acdelyes').onclick=async()=>{
    const b=$('acdelyes'); b.disabled=true; b.textContent='Deleting …';
    clearTimeout(timer); pending=null;
    const {error}=await sb.rpc('delete_my_account');
    if(error){ $('acdelmsg').className='amsg err'; $('acdelmsg').textContent=/function|schema cache/i.test(error.message||'')?'Account deletion isn’t set up yet (run update-2.sql in Supabase).':niceError(error); b.disabled=false; b.textContent='Yes, delete everything'; return; }
    try{ localStorage.removeItem(BASE+':'+user.id); }catch(e){}
    user=null; try{ await sb.auth.signOut({scope:'local'}); }catch(e){}
    location.replace(location.pathname);
  };
  $('aclogout').onclick=async()=>{ $('aclogout').disabled=true; $('aclogout').textContent='Saving and logging out …'; await flush(); await sb.auth.signOut(); location.reload(); };
});

// --- Start: everyone gets the app right away; logging in is optional ---
if(!configured || !window.supabase){ $('acct').hidden=true; startGuest(); return; }
window.MikroCloud.ready=true;
sb=window.supabase.createClient(CFG.supabaseUrl.replace(/\/$/,''),CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let booted=false;
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){ openAuth('reset'); return; }
  if(event==='INITIAL_SESSION' && !booted){
    booted=true;
    if(recovering){ startGuest(); openAuth('reset'); return; }
    if(session) setTimeout(()=>enter(session.user),0); else startGuest();
    return;
  }
  if(event==='SIGNED_IN' && guest && mode!=='reset'){ location.replace(location.pathname); return; } // just logged in: reload into the account
  if(event==='SIGNED_OUT' && user){ location.reload(); }
});
})();
</script>

// Offline support and "Install app"
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){

}

})();
