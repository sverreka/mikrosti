<script>
// Step-by-step solutions. One list per question, in the same order as data.js.
// The last element starting with '!' is the rule of thumb.
const STEPS = {
u1: [
 ['Equilibrium means quantity demanded equals quantity supplied: Q<sub>d</sub> = Q<sub>s</sub>.','Set the expressions equal: 100 − 10p = 10p.','Collect p on one side: 100 = 20p, so p = 5.','Plug p = 5 into either function: Q = 10·5 = 50. Check: 100 − 10·5 = 50.','!If the question asks for quantity, find the price first and then plug it back in.'],
 ['Set Q<sub>d</sub> = Q<sub>s</sub>: 400 − 20p = 30 + 30p.','Move the numbers to the left and the p terms to the right: 400 − 30 = 30p + 20p.','That gives 370 = 50p.','Divide by 50: p = 7.4. (Quantity is Q = 30 + 30·7.4 = 252.)','!Equilibrium: set the functions equal, collect p on one side, divide.'],
 ['p<sub>h</sub> (the price of hogs) is an <b>input price</b>. It shifts the supply curve but is not the market price p.','Plug in p<sub>h</sub> = 50: Q = 110 + 40p − 2·50.','2·50 = 100, so Q = 110 − 100 + 40p = 10 + 40p.','The sign is negative because more expensive hogs make production costlier, so supply falls.','!Plug in all shift variables as numbers. Only p should remain as a variable.'],
 ['The demand function is Q = D(own price, other prices, income, tastes).','A change in <b>own price</b> (the coffee price) moves us along the curve. That covers both cheaper coffee and a tax that raises the coffee price.','A change in <b>another variable</b> shifts the whole curve. Tea is a substitute: more expensive tea means more coffee at every coffee price, so the curve shifts out.','Lower costs for coffee producers shift the supply curve, not the demand curve.','!Own price: movement along. Everything else in the function: shift.'],
 ['The price elasticity is ε = (dQ/dp)·(p/Q).','For Q = a − bp, dQ/dp = −b, which is constant. But the ratio p/Q changes along the curve.','At p = 0, ε = −b·0/a = 0 (perfectly inelastic).','As p approaches a/b, Q approaches 0 and ε goes to −∞ (very elastic). In the middle of the curve ε = −1.','So the statement is <b>false</b>. It is the slope that is constant, not the elasticity.','!Linear curve: constant slope, but the elasticity varies. Constant elasticity requires Q = A·p<sup>ε</sup>.'],
 ['Formula: ε = (dQ/dp)·(p/Q).','Differentiate: Q = 100 − 2p gives dQ/dp = −2.','Find Q at the point: Q = 100 − 2·20 = 60.','Plug in: ε = −2·20/60 = −40/60 = −0.67.','Since −1 &lt; ε &lt; 0, demand is inelastic at this point.','!Elasticity = slope × (p/Q). Remember to compute Q at the point first.'],
 ['Constant-elasticity form: Q = A·p<sup>ε</sup>.','dQ/dp = −2·5p<sup>−3</sup> = −10p<sup>−3</sup>.','ε = (dQ/dp)·(p/Q) = −10p<sup>−3</sup>·p/(5p<sup>−2</sup>) = −10p<sup>−2</sup>/(5p<sup>−2</sup>) = −2.','p drops out of the expression, so the elasticity is −2 at all prices. A = 5 plays no role.','!For power functions the elasticity equals the exponent.'],
 ['Cross-price elasticity: (∂Q/∂p<sub>s</sub>)·(p<sub>s</sub>/Q).','∂Q/∂p<sub>s</sub> = 3 (the coefficient on p<sub>s</sub>).','Compute Q at the point: Q = 1000 − 2·50 + 3·100 = 1000 − 100 + 300 = 1200.','Plug in: 3·100/1200 = 300/1200 = 0.25.','Positive: the goods are substitutes.','!Swap p for the other price in the elasticity formula, but still use Q for your own good.'],
 ['The cross-price elasticity measures how demand for butter responds when the price of margarine changes.','Positive: margarine more expensive ⇒ people buy more butter. The goods replace each other: <b>substitutes</b>.','Negative: more expensive margarine ⇒ less butter. That would be complements (like coffee and cream).','!Plus = substitutes, minus = complements.'],
 ['Income elasticity = (∂Q/∂Y)·(Y/Q).','A negative value means demand <b>falls</b> when income rises.','A good with this property is called inferior (examples: instant noodles, bus travel).','Luxury goods have income elasticity &gt; 1, necessities between 0 and 1. Giffen goods are inferior, but not all inferior goods are Giffen.','!Income elasticity &lt; 0: inferior. 0–1: necessity. &gt; 1: luxury.'],
 ['Increased demand means the demand curve shifts <b>out/to the right</b>.','At the old price there is now excess demand.','The price rises, and producers increase quantity supplied along the upward-sloping supply curve.','New equilibrium: higher price and higher quantity.','!Demand up ⇒ p and Q up. Supply up ⇒ p down, Q up.'],
 ['The supply elasticity is η = (dQ/dp)·(p/Q).','For Q = a + bp: dQ/dp = b, so η = bp/(a + bp).','If a ≠ 0, the fraction changes with p. Example: Q = 10 + 2p. At p = 5, η = 10/20 = 0.5. At p = 50, η = 100/110 ≈ 0.91.','Only if a = 0 (the curve passes through the origin) does η = bp/bp = 1 everywhere.','So the statement is <b>true</b>, except for curves through the origin.','!Linear curves have constant slope but varying elasticity. This applies to both supply and demand.'],
 ['Positive analysis: statements about how the world <b>is</b>, which can be tested with data.','Normative analysis: value judgments about what <b>should</b> be done.','“The government should introduce a minimum wage” contains “should”, i.e. a value judgment.','The other options describe cause and effect and are positive (they can be true or false, but they can be tested).','!If you see “should” or “ought”, the statement is normative.'],
 ['In the short run it is hard to change habits and equipment (e.g. car or heating).','In the long run consumers can find and adopt substitutes.','So quantity is more sensitive to price in the long run: demand is more elastic.','!More time ⇒ more alternatives ⇒ more elastic.']
],
u2: [
 ['Compare the goods in each bundle: B = (6 movies, 3 books), C = (2 movies, 7 books).','C has <b>more books</b> but <b>fewer movies</b> than B.','“More is better” can only rank bundles where one has at least as much of everything.','Without an indifference curve through both points we do not know how the person weighs movies against books.','!More of one good and less of another ⇒ cannot be ranked without more information.'],
 ['F = (6, 5), A = (2, 3).','F has more movies (6 &gt; 2) and more books (5 &gt; 3).','The assumption “more is better” (non-satiation) implies F is preferred.','!More of everything ⇒ always better.'],
 ['Suppose curves I<sub>1</sub> and I<sub>2</sub> cross at point X.','Take a point A on I<sub>1</sub> and a point B on I<sub>2</sub>, where B has more of both goods than A.','Because A and X are on I<sub>1</sub>: A ~ X. Because B and X are on I<sub>2</sub>: B ~ X.','Transitivity gives A ~ B, but “more is better” says B is preferred to A. Contradiction.','!Crossing indifference curves violate transitivity + “more is better”.'],
 ['MRS = −U<sub>x</sub>/U<sub>y</sub>, where x is the good on the horizontal axis. Here C is on the horizontal axis and B on the vertical axis.','U<sub>C</sub> = ∂(4BC − 4)/∂C = 4B. U<sub>B</sub> = ∂(4BC − 4)/∂B = 4C.','MRS = −U<sub>C</sub>/U<sub>B</sub> = −4B/(4C) = −B/C.','The constant −4 disappears when differentiating and does not affect the MRS.','!The numerator is the marginal utility of the good on the horizontal axis.'],
 ['MRT is the slope of the budget line: MRT = −p<sub>A</sub>/p<sub>B</sub> (A on the horizontal axis).','“4 units of B for 1 A” means 1 A is worth 4 B in the market: p<sub>A</sub> = 4·p<sub>B</sub>.','Plug in p<sub>A</sub> = 2: 2 = 4·p<sub>B</sub>.','p<sub>B</sub> = 2/4 = 0.5. Income Y = 200 is not needed.','!MRT = −p<sub>x</sub>/p<sub>y</sub>: what you give up of y for one x.'],
 ['MRT = −2: 2 units of Z trade for 1 unit of B, so B is on the horizontal axis.','That means p<sub>B</sub> = 2·p<sub>Z</sub>.','p<sub>B</sub> = 2·7 = 14.','Check: MRT = −p<sub>B</sub>/p<sub>Z</sub> = −14/7 = −2. Income (220) is unnecessary information.','!The question says how many units of one good you give up for one of the other. That is the price ratio.'],
 ['Budget line: p<sub>x</sub>x + p<sub>y</sub>y = Y.','Intercepts: x = Y/p<sub>x</sub> and y = Y/p<sub>y</sub>. Slope: −p<sub>x</sub>/p<sub>y</sub>.','If everything doubles: 2Y/(2p<sub>x</sub>) = Y/p<sub>x</sub>, and −2p<sub>x</sub>/(2p<sub>y</sub>) = −p<sub>x</sub>/p<sub>y</sub>.','All three are unchanged, so the budget line is exactly the same.','!Only relative prices and real income matter. An equal percentage change in everything changes nothing.'],
 ['An indifference curve is all bundles with the same utility: x + y = k.','Solve for y: y = k − x. That is a straight line with slope −1.','MRS = −U<sub>x</sub>/U<sub>y</sub> = −1/1 = −1 everywhere: the person always trades 1 for 1.','The goods are <b>perfect substitutes</b>. L-shaped curves belong to perfect complements (min function).','!Additive utility function ⇒ straight indifference curves.'],
 ['Perfect substitutes: the person only cares about the sum x + y.','Compare what one dollar buys: x gives 1/2.5 = 0.4 units of utility, y gives 1/5 = 0.2.','x gives the most utility per dollar, so the whole budget goes to x (corner solution).','x = 500/2.5 = 200, and y = 0.','!Perfect substitutes: compare MU/p and spend everything on the best good.'],
 ['Lagrangian: L = 8x<sup>0.4</sup>y<sup>0.6</sup> + λ(m − p<sub>x</sub>x − p<sub>y</sub>y).','∂L/∂x = 3.2x<sup>−0.6</sup>y<sup>0.6</sup> − λp<sub>x</sub> = 0 and ∂L/∂y = 4.8x<sup>0.4</sup>y<sup>−0.4</sup> − λp<sub>y</sub> = 0.','Divide one by the other: (3.2/4.8)·(y/x) = p<sub>x</sub>/p<sub>y</sub>, i.e. 2y/(3x) = p<sub>x</sub>/p<sub>y</sub>, so p<sub>y</sub>y = 1.5·p<sub>x</sub>x.','Plug into the budget: p<sub>x</sub>x + 1.5p<sub>x</sub>x = m ⇒ 2.5p<sub>x</sub>x = m ⇒ x = m/(2.5p<sub>x</sub>) = 2m/(5p<sub>x</sub>).','!Cobb-Douglas shortcut: x = (a/(a+b))·m/p<sub>x</sub>. Here 0.4/(0.4+0.6) = 0.4.'],
 ['The constant 10 and the factor 2 change the value of U, but not which bundle is best (monotonic transformation).','What remains is Cobb-Douglas B<sup>0.2</sup>Z<sup>0.8</sup> with exponents that sum to 1.','Shortcut: the share of income spent on B is 0.2. So p<sub>B</sub>B = 0.2Y.','B = 0.2Y/p<sub>B</sub>.','!Added constants and multiplying factors in front of Cobb-Douglas do not affect demand.'],
 ['The optimum is where the indifference curve is tangent to the budget line.','Tangency: equal slopes, MRS = MRT ⇒ −U<sub>x</sub>/U<sub>y</sub> = −p<sub>x</sub>/p<sub>y</sub>.','Drop the minus signs: U<sub>x</sub>/U<sub>y</sub> = p<sub>x</sub>/p<sub>y</sub>.','Equivalent: U<sub>x</sub>/p<sub>x</sub> = U<sub>y</sub>/p<sub>y</sub> (equal marginal utility per dollar). Note option 4 has the prices in the wrong denominators.','!The last dollar should give the same utility whichever good it is spent on.'],
 ['Higher indifference curves give higher utility (more is better).','So the consumer wants to reach the <b>highest</b> curve that still touches the budget set.','The optimum is typically the tangency between the budget line and the highest attainable curve.','The statement is <b>false</b>. Lower curves can be reached, but they give lower utility.','!Maximize utility = highest attainable indifference curve.'],
 ['U = min(x, y): the person always wants x and y in a 1:1 ratio. Extra of one good alone gives no utility.','So the optimum is at the kink: x = y.','Plug into the budget: 2x + 4y = 120 with y = x ⇒ 6x = 120.','x = y = 20.','!Perfect complements: use the ratio from the min function and plug into the budget.'],
 ['The first-order condition gives U<sub>x</sub> = λp<sub>x</sub>, i.e. λ = U<sub>x</sub>/p<sub>x</sub>.','U<sub>x</sub>/p<sub>x</sub> is the extra utility from the last dollar spent on x.','So λ is the marginal utility of income: how much utility rises if the budget rises by one dollar.','!λ = the shadow price of the budget constraint.'],
 ['Budget share = spending on x divided by income: p<sub>x</sub>x/m.','Demand is x = 0.4m/p<sub>x</sub> (from Cobb-Douglas).','p<sub>x</sub>x = p<sub>x</sub>·0.4m/p<sub>x</sub> = 0.4m.','The share is 0.4m/m = 0.4, independent of prices and income.','!Cobb-Douglas: the budget share equals the exponent (when the exponents sum to 1).']
],
u3: [
 ['The PCC (price-consumption curve) is made by changing <b>one price</b> (p<sub>X</sub>) and finding the new optimum each time.','Everything else is held fixed: income and the price of Y.','The budget line then rotates around its intercept on the Y axis.','Utility is not held constant: it changes as p<sub>X</sub> changes.','!PCC: one price varies, income fixed. ICC: income varies, prices fixed.'],
 ['The ICC (income-consumption curve) is made by changing income.','Prices are held fixed, so the budget line shifts outward in parallel.','The optimum in each case forms the ICC.','From the ICC you can derive the Engel curve (income against quantity).','!Parallel shifts in the budget line ⇒ ICC.'],
 ['Along the ICC, income rises.','As income rises, consumption of X falls. That means negative income elasticity: X is <b>inferior</b>.','Consumption of Y rises with income, so Y is normal.','Both goods cannot be inferior, because then the extra income would not all be spent.','!An ICC that bends back toward the Y axis ⇒ X is inferior.'],
 ['A price change has two effects: a change in the relative price and a change in purchasing power.','To isolate the effect of the relative price, we give the consumer enough income to stay on the <b>same indifference curve</b>.','The movement along the original curve is the substitution effect. Utility is held constant.','The rest (the shift to a new curve) is the income effect.','!Substitution effect = same utility, new relative prices.'],
 ['The substitution effect is a movement along the same indifference curve.','When x becomes relatively more expensive, the budget line gets steeper, and the tangency point slides toward less x.','With convex indifference curves, the substitution effect can never increase the quantity of the good that became more expensive.','The income effect can go either way, depending on whether the good is normal or inferior.','!The substitution effect always moves opposite to the price change.'],
 ['The substitution effect of a price increase is always negative (less of the good).','The income effect depends on the good: for a normal good, lower purchasing power means less consumption (negative).','For an inferior good, lower purchasing power means <b>more</b> consumption, so the income effect pulls the other way.','Because “all consumers” includes some who may see the good as inferior, the statement is <b>false</b>.','!Watch out for the word “all”. One counterexample is enough to reject the statement.'],
 ['Total effect = substitution effect + income effect.','For a price increase, the substitution effect is always negative.','An inferior good has a positive income effect from a price increase (poorer ⇒ buys more).','Giffen: the positive income effect is larger than the substitution effect, so the total effect is positive. The demand curve slopes upward.','!All Giffen goods are inferior, but not all inferior goods are Giffen.'],
 ['Demand is x = 0.4m/p<sub>x</sub> = 0.4m·p<sub>x</sub><sup>−1</sup>.','dx/dp<sub>x</sub> = −0.4m/p<sub>x</sub><sup>2</sup>.','ε = (dx/dp<sub>x</sub>)·(p<sub>x</sub>/x) = (−0.4m/p<sub>x</sub><sup>2</sup>)·p<sub>x</sub>/(0.4m/p<sub>x</sub>).','Simplify: = (−0.4m/p<sub>x</sub>)/(0.4m/p<sub>x</sub>) = −1.','!Demand of the form constant/p has elasticity −1: spending is constant.'],
 ['x = 0.4m/p<sub>x</sub>, so dx/dm = 0.4/p<sub>x</sub>.','Income elasticity: (dx/dm)·(m/x) = (0.4/p<sub>x</sub>)·m/(0.4m/p<sub>x</sub>).','Simplify: = (0.4m/p<sub>x</sub>)/(0.4m/p<sub>x</sub>) = 1.','One percent more income gives one percent more x.','!Cobb-Douglas: income elasticity 1 for both goods.'],
 ['With Cobb-Douglas, demand for good 2 is y = (1 − a)Y/p<sub>2</sub>.','The expression does not contain p<sub>1</sub>.','When p<sub>1</sub> rises, x changes but y stays the same. The optimal points lie on a <b>horizontal</b> line.','Explanation: the consumer always spends the same share of income on good 2.','!Cobb-Douglas: cross-price elasticity 0 ⇒ horizontal PCC.'],
 ['Cobb-Douglas shortcut: x = a·m/p<sub>x</sub>, where a is the x exponent (when the exponents sum to 1).','Here a = 0.4, m = 1000 and p<sub>x</sub> = 10.','x = 0.4·1000/10 = 400/10 = 40.','Check: spending on x = 10·40 = 400 = 40% of 1000.','!Cobb-Douglas: spending on the good = exponent × income.'],
 ['Income elasticity above 1: consumption rises by a larger percentage than income.','The share of income spent on the good rises as you get richer.','That is the definition of a luxury good.','Necessities lie between 0 and 1, inferior goods below 0.','!&gt; 1 luxury, 0–1 necessity, &lt; 0 inferior.'],
 ['The Engel curve shows how much of a good is bought at different income levels, with prices fixed.','It is derived from the ICC: for each income, read off the quantity of the good.','Upward-sloping Engel curve ⇒ normal good. Downward-sloping ⇒ inferior.','!Engel curve = income against quantity.']
],
u4: [
 ['Find the quantity at p = 10: 10 = 80 − 2Q ⇒ 2Q = 70 ⇒ Q = 35.','Consumer surplus is the triangle between the demand curve and the price.','The height is the choke price minus the price: 80 − 10 = 70. The base is Q = 35.','CS = ½·35·70 = 1225.','!CS (linear) = ½ · quantity · (intercept on the p axis − price).'],
 ['Find q at p = 25: 25 = 75 − 2q ⇒ 2q = 50 ⇒ q = 25.','Height of the triangle: 75 − 25 = 50.','CS = ½·25·50 = 625.','!Find the quantity first, then the triangle.'],
 ['At p = 40: 40 = 80 − 2Q ⇒ Q = 20. CS = ½·20·(80 − 40) = 400.','At p = 10: Q = 35. CS = ½·35·(80 − 10) = 1225.','The increase is 1225 − 400 = 825.','Alternatively: the rectangle 30·20 = 600 (lower price on the old units) plus the triangle ½·15·30 = 225 (new units) = 825.','!ΔCS from a price fall = rectangle (old purchases) + triangle (new purchases).'],
 ['After a price increase the consumer is on a lower indifference curve.','CV asks: how much money must we give her <b>at the new prices</b> for her to get back to the original curve?','Option 2 describes EV, which is measured at the old prices.','The change in CS approximates CV and EV, but is not equal to them when there are income effects.','!CV: compensation after the change, back to old utility. EV: amount before the change that gives the new utility.'],
 ['CV, CS and EV differ only because of the income effect.','Normal good, price increase: |CV| &gt; |CS| &gt; |EV|. CV is measured at higher prices and must therefore be the largest.','For an inferior good the income effect goes the other way, and the order flips: |EV| &gt; |CS| &gt; |CV|.','The question describes the flipped order, i.e. an inferior good.','!Normal good: CV largest. Inferior good: EV largest. No income effect: all equal.'],
 ['The difference between CV, CS and EV comes from the income effect.','With quasilinear utility (e.g. U = v(x) + y), demand for x does not depend on income.','Then the income effect is zero and the three measures are identical.','!No income effect ⇒ CV = CS = EV.'],
 ['A higher wage makes leisure more expensive (an hour of leisure costs w).','Substitution effect: leisure is more expensive ⇒ less leisure ⇒ <b>work more</b>.','Income effect: higher income ⇒ can afford more leisure (normal good) ⇒ <b>work less</b>.','If the income effect is larger, you work less at a higher wage: the labor supply curve bends backward. The statement is <b>true</b>.','!Wage increase: substitution effect ⇒ more work, income effect ⇒ less work.'],
 ['Julia chose 10 hours when she was free to choose. That was her utility-maximizing point.','The 8-hour limit means she cannot reach that point.','All the bundles available to her now were also available before, and she chose 10 hours then. So 8 hours gives lower utility.','She is worse off.','!A binding constraint can never make a rational person better off.'],
 ['Write utility as a function of H: U = (64H)<sup>0.5</sup> + 2(24 − H) = 8H<sup>0.5</sup> + 48 − 2H.','Differentiate: dU/dH = 8·0.5·H<sup>−0.5</sup> − 2 = 4/√H − 2.','Set equal to 0: 4/√H = 2 ⇒ √H = 2 ⇒ H = 4.','Interpretation: the extra utility from one more hour’s income (4/√H) should equal the utility of the leisure you give up (2).','!Plug in Y = wH and N = 24 − H so utility depends only on H. Differentiate and set equal to 0.'],
 ['The gift card can only be used on books, so it gives a budget set with a “kink”.','500 in cash gives the same budget set, plus the option to spend the money on other things.','If the student would buy at least 500 worth of books anyway: equally well off.','If the student would rather buy fewer books: strictly better off with cash. The statement is <b>true</b> (at least as well off).','!Cash gives a budget set that is at least as large ⇒ never worse off.'],
 ['A higher wage means higher income for the same number of hours.','If leisure is a normal good, you buy more of it when income rises.','More leisure means fewer working hours. The income effect pulls toward less work.','The substitution effect pulls in the opposite direction (leisure is more expensive).','!Income effect on leisure: richer ⇒ more leisure.']
],
u5: [
 ['Plug L = 10 and K = 10 into q = 5KL.','q = 5·10·10 = 500.','!Production function: plug in the numbers directly.'],
 ['Returns to scale for AK<sup>a</sup>L<sup>b</sup>: look at a + b. Marginal returns: look at each exponent alone.','7K<sup>0.5</sup>L<sup>0.5</sup>: a + b = 1 ⇒ constant returns to scale. Each exponent is 0.5 &lt; 1 ⇒ diminishing marginal product.','10KL: the exponents are 1 and 1, sum 2 ⇒ increasing returns to scale, and MP<sub>L</sub> = 10K is constant.','K<sup>0.4</sup>L<sup>0.8</sup>: the sum is 1.2 ⇒ increasing returns to scale.','!Returns to scale: the sum of the exponents. Marginal returns: each exponent alone.'],
 ['Sum of exponents: 0.1 + 0.7 = 0.8 &lt; 1 ⇒ <b>decreasing</b> returns to scale.','MP<sub>L</sub> = 0.8L<sup>−0.9</sup>K<sup>0.7</sup>. The exponent on L is negative, so MP<sub>L</sub> falls as L increases.','MP<sub>K</sub> = 5.6L<sup>0.1</sup>K<sup>−0.3</sup> also falls as K increases.','Both marginal products are diminishing.','!Exponent below 1 ⇒ diminishing marginal product for that input.'],
 ['With K = 4 fixed, q = 4L<sup>0.7</sup>.','Marginal product: MP<sub>L</sub> = 4·0.7·L<sup>−0.3</sup> = 2.8L<sup>−0.3</sup>.','L<sup>−0.3</sup> gets smaller as L increases, so MP<sub>L</sub> falls.','That is diminishing marginal returns to labor. Capital is fixed, so its marginal returns are not at issue here.','!Short run: differentiate with respect to L and see whether MP<sub>L</sub> rises or falls.'],
 ['Along an isoquant output is constant: dq = MP<sub>L</sub>dL + MP<sub>K</sub>dK = 0.','Solve for the slope: dK/dL = −MP<sub>L</sub>/MP<sub>K</sub>.','The MRTS tells you how much K you can cut when you add one unit of L, while producing the same amount.','!MRTS = −MP(input on horizontal axis)/MP(input on vertical axis), like MRS.'],
 ['MP<sub>L</sub> = ∂q/∂L. Differentiate q = 100KL + 100L with respect to L, treating K as a constant.','∂(100KL)/∂L = 100K and ∂(100L)/∂L = 100. So MP<sub>L</sub> = 100K + 100.','Plug in K = 10: 1000 + 100 = 1100.','!Partial differentiation: all other variables are constants.'],
 ['MP<sub>L</sub> = 100K + 100 = 100(K + 1).','MP<sub>K</sub> = ∂(100KL + 100L)/∂K = 100L.','MRTS = −MP<sub>L</sub>/MP<sub>K</sub> = −100(K + 1)/(100L) = −(K + 1)/L.','!Factor out common terms to simplify the fraction.'],
 ['The isoquant for q = 90,000: 100L(K + 1) = 90,000 ⇒ L(K + 1) = 900.','Does it hit the L axis? Set K = 0: L·1 = 900 ⇒ L = 900. Yes.','Does it hit the K axis? Set L = 0: 0·(K + 1) = 0 ≠ 900, whatever K is. No.','Without labor there are no apples, but without capital it works (the +100L term).','!Test the axes by setting one input to 0.'],
 ['For AK<sup>a</sup>L<sup>b</sup>: if you multiply both inputs by t, output becomes t<sup>a+b</sup> times as large.','Here a + b = 0.6 + 0.6 = 1.2.','Doubling inputs gives 2<sup>1.2</sup> ≈ 2.3 times as much output, i.e. more than double.','That is increasing returns to scale.','!a + b &gt; 1 increasing, = 1 constant, &lt; 1 decreasing.'],
 ['MP<sub>L</sub> = 2 and MP<sub>K</sub> = 5, no matter how much you use.','MRTS = −2/5, constant ⇒ the isoquants are straight lines.','The inputs can fully replace each other at the rate of 5 L for 2 K. These are called perfect substitutes.','!Linear production function ⇒ straight isoquants (perfect substitutes).'],
 ['AP<sub>L</sub> = q/L is the average. MP<sub>L</sub> is the output of the last worker.','If the last worker produces more than the average (MP &gt; AP), he pulls the average up.','If he produces less (MP &lt; AP), he pulls the average down.','So MP = AP exactly where AP peaks.','!Same logic as a grade average: a grade above the average raises the average.'],
 ['Multiply both inputs by 2: q′ = 2(2K)<sup>0.4</sup>(2L)<sup>0.8</sup> = 2<sup>0.4</sup>·2<sup>0.8</sup>·2K<sup>0.4</sup>L<sup>0.8</sup>.','2<sup>0.4</sup>·2<sup>0.8</sup> = 2<sup>1.2</sup>, so q′ = 2<sup>1.2</sup>·q.','Calculator: 2<sup>1.2</sup> ≈ 2.297 ≈ 2.30.','More than 2 ⇒ increasing returns to scale. The constant 2 in front does not affect the factor.','!Scaling by t gives t<sup>(sum of exponents)</sup>.']
],
u6: [
 ['Explicit costs: actual payments, such as wages, rent and materials.','Implicit costs: the value of resources you already own and could have used for something else, such as your own working time or your own premises.','Economic cost = explicit + implicit. Accounting cost includes only explicit costs.','!Implicit cost = opportunity cost.'],
 ['Split the costs: F = 1000 (does not depend on q). VC = 10q + q<sup>2</sup>.','AVC = VC/q = (10q + q<sup>2</sup>)/q = 10 + q.','1000/q + 10 + q is AC (includes fixed costs). 10 + 2q is MC (the derivative).','!AVC: take only the terms with q, and divide by q.'],
 ['AC = C/q = (0.5q<sup>2</sup> + 500)/q = 0.5q + 500/q.','Minimum: dAC/dq = 0.5 − 500/q<sup>2</sup> = 0.','500/q<sup>2</sup> = 0.5 ⇒ q<sup>2</sup> = 1000 ⇒ q = √1000 = √(100·10) = 10√10 ≈ 31.6.','Check: MC = q = 31.6 and AC = 15.8 + 15.8 = 31.6. MC = AC at the minimum.','!Min AC: differentiate AC and set it equal to 0, or set MC = AC.'],
 ['MC = dC/dq.','C = 0.5q<sup>2</sup> + 500 ⇒ MC = 2·0.5q = q.','At q = 20: MC = 20. Fixed costs do not affect MC.','!MC is the derivative of C. Constants disappear.'],
 ['If MC &lt; AC, the next unit costs less than the average, and AC falls.','If MC &gt; AC, the next unit costs more, and AC rises.','AC goes from falling to rising exactly where MC = AC. That is the minimum point.','The same holds for AVC: MC crosses AVC at the minimum of AVC.','!MC crosses AC and AVC from below at their lowest points.'],
 ['Short run: K = 100 is fixed. Output q = 2√L.','Solve for L (the hours of labor needed): √L = q/2 ⇒ L = q<sup>2</sup>/4.','Cost: C = rK + wL = 8·100 + 20·q<sup>2</sup>/4.','C(q) = 800 + 5q<sup>2</sup>. FC = 800 and VC = 5q<sup>2</sup>.','!Short-run cost: solve the production function for the variable input and plug into C = wL + rK̄.'],
 ['The cost of one extra unit of output via labor is w/MP<sub>L</sub>. Via capital it is r/MP<sub>K</sub>.','If one is cheaper, it pays to switch toward that input.','At the optimum they are equal: w/MP<sub>L</sub> = r/MP<sub>K</sub>, i.e. MP<sub>L</sub>/w = MP<sub>K</sub>/r.','Graphically: the isoquant is tangent to the isocost line, MRTS = −w/r.','!Equal extra output per dollar for all inputs.'],
 ['Perfect substitutes: use only the input that gives the cheapest output.','One unit of L costs 10 and gives 2 units ⇒ 5 per unit of output.','One unit of K costs 20 and gives 5 units ⇒ 4 per unit of output.','Capital is cheaper. Use only K: C = 4q.','!Perfect substitutes: compare price/MP and use only the cheapest.'],
 ['Cost minimization: MRTS = −w/r. MRTS = −(K + 1)/L and w/r = 100/400 = 1/4.','(K + 1)/L = 1/4 ⇒ L = 4(K + 1).','Plug into the production function: q = 100L(K + 1) = 100·4(K + 1)·(K + 1) = 400(K + 1)<sup>2</sup>.','400(K + 1)<sup>2</sup> = 90,000 ⇒ (K + 1)<sup>2</sup> = 225 ⇒ K + 1 = 15 ⇒ K = 14.','Then L = 4·15 = 60.','!The tangency condition gives a ratio between K and L. Plug it into the production function.'],
 ['The cost is C = rK + wL.','From the previous question: K = 14 and L = 60.','C = 400·14 + 100·60 = 5600 + 6000 = 11,600.','!Once you have the optimal K and L, the cost is just input price × quantity.'],
 ['A sunk cost has already been paid and cannot be recovered.','It is the same whether you continue or stop.','Decisions should be based only on costs affected by the choice, i.e. future and variable costs.','!What is lost is lost. Sunk costs do not affect optimal choices.'],
 ['Economies of scope: producing two different goods in the same firm is cheaper than in two separate firms.','Formally: C(q<sub>1</sub>, q<sub>2</sub>) &lt; C(q<sub>1</sub>, 0) + C(0, q<sub>2</sub>).','Example: an airline carries both passengers and cargo on the same plane.','Economies of scale (falling AC for one good) and learning by doing are different concepts.','!Scope = breadth (several goods). Scale = size (more of one good).']
],
u7: [
 ['Profit: π = pq − C(q). The first-order condition: dπ/dq = p − MC = 0 ⇒ <b>p = MC</b>.','In addition the firm must cover its variable costs: pq − VC ≥ 0 ⇒ p ≥ AVC.','Min AVC is therefore just the shutdown point (the lowest price at which producing pays).','The optimal quantity is where p = MC, which is usually a different quantity from where AVC is lowest. The statement is <b>false</b>.','!Competitive firm: p = MC gives the quantity. p ≥ AVC decides whether it produces.'],
 ['“Makes a loss” ⇒ pq &lt; C ⇒ p &lt; AC.','“Does not shut down” ⇒ revenue covers variable costs ⇒ p ≥ AVC.','Together: AVC ≤ p ≤ AC.','The firm produces because it then loses less than the fixed costs it would lose by shutting down.','!Loss but operating: p between AVC and AC.'],
 ['The tax adds 5 to every unit. Effective MC is MC + t.','MC = dC/dq = 3·0.008q<sup>2</sup> + 25 = 0.024q<sup>2</sup> + 25.','Optimum: p = MC + t ⇒ 100 = 0.024q<sup>2</sup> + 25 + 5.','0.024q<sup>2</sup> = 70 ⇒ q<sup>2</sup> = 2916.7 ⇒ q ≈ 54.','!Specific tax for a competitive firm: p = MC + t.'],
 ['If firms earn positive economic profit, it pays for new firms to enter.','More firms increase market supply, and the price falls.','This continues until profit is zero (p = min AC). With losses, firms exit until the price rises again.','Differentiated products and asymmetric information do not belong to perfect competition.','!Free entry and exit ⇒ zero profit in the long run.'],
 ['Fixed costs (F) must be paid whether or not the firm produces in the short run.','Shutting down gives profit −F. Operating gives pq − VC − F.','Operating is better as long as pq − VC ≥ 0, i.e. p ≥ AVC. Total costs are not the relevant comparison.','The statement is <b>false</b>.','!Short run: compare revenue with VC, not with C.'],
 ['The Lerner index: L = (p − MC)/p, a measure of market power.','A price-taking firm chooses p = MC.','Then L = 0/p = 0.','!No market power ⇒ Lerner = 0.'],
 ['MC = dC/dq = 2q.','Optimum: p = MC ⇒ 40 = 2q ⇒ q = 20.','Revenue: 40·20 = 800. Cost: 100 + 20<sup>2</sup> = 500.','Profit: 800 − 500 = 300.','!Find q from p = MC, plug into π = pq − C(q).'],
 ['For each price the firm chooses q where p = MC. So the MC curve shows the quantity supplied at each price.','Below min AVC the firm shuts down, and supply is 0.','The short-run supply curve is thus the rising part of MC above min AVC.','In the long run the threshold is min AC instead.','!Short run: MC above min AVC. Long run: MC above min AC.'],
 ['Long-run equilibrium: zero profit ⇒ p = min AC.','AC = (q<sup>2</sup> + 16)/q = q + 16/q.','dAC/dq = 1 − 16/q<sup>2</sup> = 0 ⇒ q<sup>2</sup> = 16 ⇒ q = 4.','Min AC = 4 + 16/4 = 8. So p = 8.','Check: MC = 2q = 8 = AC.','!Long-run price = minimum of AC.'],
 ['A specific tax t makes each unit cost t more to sell.','Variable cost becomes VC(q) + tq. MC becomes MC(q) + t.','AVC and AC also rise by t per unit. Fixed costs do not change.','!Specific tax = parallel shift up in MC, AVC and AC.']
],
u8: [
 ['DWL is the triangle of trades that disappear because of the tax.','When demand is elastic, buyers react strongly to the price increase, and many trades disappear.','Inelastic demand gives a small fall in quantity and a small triangle.','B is more elastic than A, so the DWL is largest in B. Tax revenue is a transfer and does not remove the loss.','!More elastic ⇒ larger fall in quantity ⇒ larger DWL.'],
 ['Equilibrium: 140 − 10p = 10p ⇒ p = 7 and Q = 70.','The ceiling of 3 &lt; 7, so it binds. Quantity supplied: Q<sub>s</sub> = 10·3 = 30. Trade is limited by supply.','Consumers’ willingness to pay for the 30th unit: 30 = 140 − 10p ⇒ p = 11.','The DWL is the triangle between Q = 30 and Q = 70, from p = 3 up to p = 11: ½·(70 − 30)·(11 − 3) = ½·40·8 = 160.','!Price ceiling: quantity is set by supply. DWL = ½ · ΔQ · (demand price − supply price).'],
 ['Without the ceiling: 100 − 10p = 10p ⇒ p = 5, Q = 50. Inverse demand: p = 10 − Q/10. CS = ½·50·(10 − 5) = 125.','With the ceiling p = 4: quantity supplied = 40. Consumers get 40 units at price 4.','CS = area under demand from 0 to 40 minus what they pay: ∫(10 − Q/10)dQ − 4·40 = (400 − 80) − 160 = 160.','Change: 160 − 125 = +35. (Gain from the lower price: 40·1 = 40, minus lost units: ½·10·1 = 5.)','!ΔCS = rectangle (lower price on remaining units) − triangle (lost units).'],
 ['A tax creates a wedge between the price buyers pay and the price sellers receive.','How much is passed on to buyers depends on the elasticities: the buyer price rises by t·η/(η − ε).','When both supply and demand have normal slopes, the tax is shared. The buyer price rises by less than t.','Exception: perfectly inelastic demand (vertical) or perfectly elastic supply (horizontal). Then the price rises by the full t.','!The least elastic side of the market bears most of the tax.'],
 ['A tax on sellers means sellers are left with p − 10.','Supply becomes Q = p − 10 (in terms of the buyer price). Demand is still Q = 100 − p.','New equilibrium: 100 − p = p − 10 ⇒ 2p = 110 ⇒ p = 55.','Sellers get 45. Before the tax p = 50, so consumers and producers share the tax equally (equal slopes).','!Tax on sellers: replace p with (p − t) in the supply function.'],
 ['Without the tax: Q = 50. With the tax: Q = 100 − 55 = 45.','The DWL is the triangle between Q = 45 and Q = 50, with height equal to the tax (55 − 45 = 10).','DWL = ½·(50 − 45)·10 = 25.','!DWL of a tax = ½ · t · ΔQ.'],
 ['With equal import quantities, a tariff and a quota give the same domestic price and the same deadweight loss.','The difference is who gets the gain between the world price and the domestic price on imports.','Tariff: the government gets the revenue. Quota: it goes to importers with licenses (often foreign).','From a national welfare perspective a tariff is better. The statement is <b>false</b>.','!Tariff gives government revenue. Quota gives quota rents to license holders.'],
 ['Price floor above equilibrium: p̄ &gt; p*.','At a higher price, producers want to supply more and consumers want to buy less.','Q<sub>s</sub> &gt; Q<sub>d</sub>: excess supply. Only Q<sub>d</sub> is sold.','!Price floor above equilibrium ⇒ surplus. Price ceiling below equilibrium ⇒ shortage.'],
 ['W = CS + PS is the area between demand and supply up to the quantity traded.','It grows as long as willingness to pay (the demand curve) is above MC (the supply curve).','It is maximized where they cross, i.e. in the competitive equilibrium where p = MC.','Monopoly and price ceilings give lower output and a deadweight loss.','!Welfare maximum: produce until willingness to pay = marginal cost.']
],
u9: [
 ['An allocation is Pareto efficient if no trades can make both better off.','If the indifference curves cross, there is a “lens” between them where both are better off. Then we are not efficient.','The curves are tangent when MRS<sub>1</sub> = MRS<sub>2</sub>. All such points make up the contract curve.','!Contract curve = all tangency points = all Pareto efficient allocations.'],
 ['Pareto efficient: you cannot make anyone better off without making someone else worse off.','It says nothing about fairness. One person having everything can be Pareto efficient.','Nor is it about maximizing the sum of utility.','!Pareto is about efficiency, not distribution.'],
 ['In a competitive market everyone faces the same prices.','Each consumer chooses MRS = −p<sub>x</sub>/p<sub>y</sub>, so everyone has the same MRS.','Equal MRS means there are no gains from further trade: the allocation is Pareto efficient.','Second theorem: any efficient allocation can be reached with the right redistribution and then the market.','!1st theorem: competition ⇒ efficiency.'],
 ['In equilibrium, desired purchases of X must equal desired sales of X.','Here Mara wants to buy 27, but Nils only wants to sell 18: excess demand for X.','To eliminate it, the relative price of X must rise. Mara will then buy less, and Nils will sell more.','!Excess demand ⇒ the price of that good must rise.'],
 ['M is on the same indifference curve at R as at A ⇒ M has the same utility.','N is on a higher indifference curve at R ⇒ N is better off.','Nobody is worse off, at least one is better off: it is a Pareto improvement.','!Same indifference curve = same utility.'],
 ['Set supply equal to demand in each market.','Market 1: 10 − 2p<sub>1</sub> + p<sub>2</sub> = p<sub>1</sub> ⇒ 3p<sub>1</sub> − p<sub>2</sub> = 10.','Market 2: 10 − 2p<sub>2</sub> + p<sub>1</sub> = p<sub>2</sub> ⇒ 3p<sub>2</sub> − p<sub>1</sub> = 10.','From the first: p<sub>2</sub> = 3p<sub>1</sub> − 10. Plug into the second: 3(3p<sub>1</sub> − 10) − p<sub>1</sub> = 10 ⇒ 8p<sub>1</sub> = 40 ⇒ p<sub>1</sub> = 5, and p<sub>2</sub> = 5.','!Related markets: two equations with two unknowns. Solve by substitution.'],
 ['Partial analysis: a minimum wage above equilibrium in one market ⇒ unemployment.','General analysis: the minimum wage often covers only part of the labor market (the covered sector).','Those who lose their jobs in the covered sector can look for work in the uncovered sector. There supply rises and the wage falls.','The result can be lower wages in the uncovered sector instead of a lot of unemployment. The statement is <b>true</b>.','!General equilibrium: take into account that resources move between markets.'],
 ['Each consumer adjusts so that MRS = −p<sub>x</sub>/p<sub>y</sub>.','Prices are the same for everyone in the market.','So the MRS is equal for all consumers. That is the condition for Pareto efficiency in exchange.','!Common prices ⇒ common MRS ⇒ efficient distribution.']
],
u10: [
 ['Total revenue: R = pQ = 20Q − Q<sup>2</sup>/1000.','MR = dR/dQ = 20 − 2Q/1000 = 20 − Q/500. (Twice the slope of demand.)','MC = dC/dQ = 1.','MR = MC: 20 − Q/500 = 1 ⇒ Q/500 = 19 ⇒ Q = 9500.','Price from demand: p = 20 − 9500/1000 = 20 − 9.5 = 10.5.','!Monopoly: find Q from MR = MC. Find the price from the demand curve, not from MR.'],
 ['Inverse demand p = 10 − Q/1000 ⇒ MR = 10 − 2Q/1000 = 10 − Q/500.','MC = 2.','MR = MC: 10 − Q/500 = 2 ⇒ Q = 4000.','p = 10 − 4000/1000 = 6.','!Linear inverse demand p = a − bQ ⇒ MR = a − 2bQ.'],
 ['The monopoly pricing rule: MR = p(1 + 1/ε) = MC ⇒ p = MC/(1 + 1/ε).','1/ε = 1/(−5) = −0.2, so 1 + 1/ε = 0.8.','p = 10/0.8 = 12.5.','Check with Lerner: (12.5 − 10)/12.5 = 0.2 = −1/ε. ✓','!p = MC/(1 + 1/ε). Less elastic ⇒ bigger markup.'],
 ['MR: R = 1200Q − Q<sup>2</sup> ⇒ MR = 1200 − 2Q.','MC: C = 800 + 5Q<sup>2</sup> ⇒ MC = 10Q.','MR = MC: 1200 − 2Q = 10Q ⇒ 12Q = 1200 ⇒ Q = 100.','P = 1200 − 100 = 1100.','!When MC is not constant: set MR = MC and solve, as usual.'],
 ['Revenue: P·Q = 1100·100 = 110,000.','Cost: C(100) = 800 + 5·100<sup>2</sup> = 800 + 50,000 = 50,800.','Profit: 110,000 − 50,800 = 59,200.','!Profit = pQ − C(Q). Remember the fixed costs.'],
 ['Welfare (CS + PS) is maximized where willingness to pay = marginal cost: P = MC.','1200 − Q = 10Q ⇒ 11Q = 1200 ⇒ Q = 109.09.','The monopoly produces only 100. The 9.1 units in between create the deadweight loss.','!Welfare optimum: set the demand curve (not MR) equal to MC.'],
 ['The Lerner index: L = (p − MC)/p = −1/ε at the monopoly’s optimum.','More elastic ⇒ |ε| larger ⇒ 1/|ε| smaller ⇒ L approaches 0.','Example: ε = −2 gives L = 0.5. ε = −20 gives L = 0.05.','The statement is <b>true</b>.','!L = −1/ε: elastic demand limits market power.'],
 ['MR = p(1 + 1/ε).','If |ε| &lt; 1 (inelastic), 1/ε &lt; −1, and MR is negative.','Then total revenue rises if the monopoly produces less, and costs fall too. Profit rises.','So the monopoly reduces output until |ε| &gt; 1 (MR = MC &gt; 0).','!The monopoly’s optimum is always in the elastic part.'],
 ['The monopoly chooses MR = MC, and the price ends up above MC.','Between the monopoly quantity and the welfare optimum there are units where willingness to pay &gt; MC.','These trades would have created value but do not happen. The lost area is the deadweight loss.','!p &gt; MC ⇒ too little produced ⇒ DWL.'],
 ['With p = A − bQ and MC = c: MR = A − 2bQ = c ⇒ Q = (A − c)/(2b).','Price: p = A − b(A − c)/(2b) = (A + c)/2.','Lerner: L = (p − c)/p = ((A − c)/2)/((A + c)/2) = (A − c)/(A + c).','When A rises, the numerator rises proportionally more than the denominator ⇒ L rises. The statement is <b>true</b>.','!Plug the optimal price into the Lerner formula and see how it depends on the parameter.'],
 ['R = 100Q − 2Q<sup>2</sup> ⇒ MR = 100 − 4Q.','MR = MC: 100 − 4Q = 20 ⇒ 4Q = 80 ⇒ Q = 20.','Price: p = 100 − 2·20 = 60.','!MR has twice the slope of inverse demand.'],
 ['The tax raises MC from c to c + t.','New quantity: Q = (a − c − t)/(2b), i.e. t/(2b) lower.','New price: p = a − bQ = (a + c + t)/2. The price rises by t/2.','For a competitive firm with a horizontal supply curve the price would rise by the full t.','!Monopoly with linear demand and constant MC: half the tax is passed on.'],
 ['Natural monopoly: AC falls over the whole relevant output range, typically because of large fixed costs.','One firm can then produce the whole market quantity more cheaply than two or more.','Examples: power grids, water supply, railway tracks.','!Natural monopoly = the cheapest setup is one producer.']
],
u11: [
 ['Nash equilibrium: a combination of strategies where each player chooses a <b>best response</b> given the others’ choices.','Test: can anyone gain by switching strategy alone? If no ⇒ Nash.','Nash does not require the outcome to be best for the group (prisoners’ dilemma).','!Nobody regrets their choice given what the others did.'],
 ['A dominant strategy is best whatever the opponent does.','In an equilibrium in dominant strategies, both play their dominant strategy.','Then each strategy is a best response to the opponent’s strategy, i.e. a Nash equilibrium.','The reverse does not hold: many Nash equilibria are not in dominant strategies.','!Dominant strategy equilibrium ⇒ Nash. Not the other way round.'],
 ['Counterexample: a coordination game. Two friends want to meet, either at the cinema or at a concert.','The best choice depends entirely on what the other does. No strategy is best regardless.','The game has two Nash equilibria, but no equilibrium in dominant strategies.','The statement is <b>false</b>.','!To reject “every game has …”, one counterexample is enough.'],
 ['Nash equilibrium: nobody gains by deviating alone. Pareto optimal: nobody can be better off without others being worse off.','Perloff’s airline example: Nash equilibrium q<sub>A</sub> = q<sub>U</sub> = 64 gives profit 4.1 each.','If both flew 48, both would get 4.6. That is a Pareto improvement.','So the Nash equilibrium is not Pareto optimal. The statement is <b>false</b>.','!Individual rationality does not necessarily give the best collective outcome.'],
 ['In the prisoners’ dilemma, “confess” is dominant for both.','Equilibrium in dominant strategies: both confess (2 years each).','Both would be better off staying silent (1 year each). The outcome is not Pareto efficient.','The statement is <b>false</b>.','!The prisoners’ dilemma is the standard counterexample for efficiency claims in game theory.'],
 ['Look from Larry’s side. If Duncan confesses: confess gives −2, silence gives −5. Confess is best.','If Duncan stays silent: confess gives 0, silence gives −1. Confess is best again.','Confessing is dominant for Larry, and by symmetry also for Duncan.','Equilibrium: both confess (−2, −2), even though (−1, −1) was possible.','!Find each player’s best response in each column/row. Where both are best responses: Nash.'],
 ['Firm 1: if F2 does not advertise, advertising gives 5 &gt; 4. If F2 advertises, advertising gives 1 &gt; 0. Advertising is dominant.','Firm 2: likewise advertising gives 5 &gt; 4 and 1 &gt; 0. Advertising is dominant.','Nash equilibrium: both advertise, with payoffs (1, 1).','No ads (4, 4) would be better for both, but is not stable. A prisoners’ dilemma again.','!Underline the best response in each cell. The cell with two underlines is Nash.'],
 ['In sequential games players move one after another and see what has happened.','Backward induction: start with the last player and find what she chooses in each situation.','Go one move back. The previous player knows how the last one will respond, and chooses the best given that.','The result is subgame perfect: it is Nash in every subgame and rules out non-credible threats.','!Solve backwards: last move first.'],
 ['Backwards: after “small” the rival chooses between entering (250) and not entering (0). It enters.','The incumbent therefore knows that “small” gives 250 (not 500).','“Large” gives x, and the rival does not enter.','The incumbent chooses “large” if x ≥ 250. The mistake in the tempting answer is thinking “small” gives 500.','!Do not count on the opponent’s best outcome for you. Count on what the opponent actually chooses.'],
 ['Backward induction: Kjell moves last. He maximizes 14(h<sub>D</sub> + h<sub>K</sub>)<sup>0.5</sup> − h<sub>K</sub>.','Derivative: 7(h<sub>D</sub> + h<sub>K</sub>)<sup>−0.5</sup> − 1 = 0 ⇒ h<sub>D</sub> + h<sub>K</sub> = 49. Kjell tops up to 49 hours in total.','Daniel knows the total will be 49 as long as h<sub>D</sub> ≤ 49. His utility becomes 12·7 − h<sub>D</sub> = 84 − h<sub>D</sub>.','It is largest at h<sub>D</sub> = 0. Then Kjell works all 49 hours.','!The one who values the project most ends up doing the work when the other can free-ride.'],
 ['Nash showed that every game with a finite number of players and strategies has at least one Nash equilibrium.','It may be in mixed strategies (randomizing between strategies).','Example: matching pennies has no equilibrium in pure strategies, but one in mixed (50/50).','!Existence is guaranteed, but the equilibrium need not be in pure strategies or unique.'],
 ['A threat is a claim about what you will do later.','It is credible only if it is actually in your interest to do it when the time comes.','Example: “I’ll start a price war if you enter” is not credible if the price war gives you lower profit than sharing the market.','Backward induction removes non-credible threats.','!Credible = you would actually carry it out when the situation arises.']
],
u12: [
 ['Write inverse demand: Q = 1600 − 100p ⇒ p = 16 − Q/100, so a = 16 and b = 0.01.','Firm 1 maximizes (16 − 0.01(q<sub>1</sub> + q<sub>2</sub>) − 0.28)q<sub>1</sub> ⇒ 15.72 − 0.02q<sub>1</sub> − 0.01q<sub>2</sub> = 0.','Symmetry (q<sub>1</sub> = q<sub>2</sub> = q): 15.72 = 0.03q ⇒ q = 524.','Shortcut: q = (a − c)/(3b) = 15.72/0.03 = 524.','!Cournot (2 identical firms): q<sub>i</sub> = (a − c)/(3b). Remember to rewrite as inverse demand first.'],
 ['Inverse: p = 4 − Q/1000, so a = 4 and b = 0.001.','c = 0.22, so a − c = 3.78.','q = 3.78/(3·0.001) = 3.78/0.003 = 1260 per firm.','!Getting b wrong is the most common mistake: b is the coefficient in inverse demand.'],
 ['Inverse: p = 45 − Q. Reaction functions from dπ<sub>i</sub>/dq<sub>i</sub> = 0:','Firm 1: 45 − 2q<sub>1</sub> − q<sub>2</sub> − 1 = 0 ⇒ q<sub>1</sub> = (44 − q<sub>2</sub>)/2.','Firm 2: 45 − q<sub>1</sub> − 2q<sub>2</sub> − 2 = 0 ⇒ q<sub>2</sub> = (43 − q<sub>1</sub>)/2.','Solve: q<sub>1</sub> = (44 − (43 − q<sub>1</sub>)/2)/2 ⇒ 4q<sub>1</sub> = 88 − 43 + q<sub>1</sub> ⇒ q<sub>1</sub> = 15. So q<sub>2</sub> = 14 and Q = 29.','!Different costs: q<sub>1</sub> = (a − 2c<sub>1</sub> + c<sub>2</sub>)/(3b). The cheapest firm produces the most.'],
 ['After the merger there is one monopoly with MC = 1.','R = (45 − Q)Q ⇒ MR = 45 − 2Q.','MR = MC: 45 − 2Q = 1 ⇒ Q = 22.','p = 45 − 22 = 23 (up from 45 − 29 = 16 in Cournot).','!Merger ⇒ monopoly outcome with the lowest MC.'],
 ['Key words: homogeneous product + quantity competition + one firm moves first (leader).','Cournot: quantity, simultaneous. Bertrand: price. Monopoly: only one firm.','Sequential quantity competition with a leader and followers is Stackelberg.','!Stackelberg = Cournot with an order of moves.'],
 ['The follower’s reaction function (Cournot best response): q<sub>2</sub> = (90 − q<sub>1</sub>)/2.','The leader plugs this into its profit: π<sub>1</sub> = (100 − q<sub>1</sub> − (90 − q<sub>1</sub>)/2 − 10)q<sub>1</sub> = (45 − q<sub>1</sub>/2)q<sub>1</sub>.','dπ<sub>1</sub>/dq<sub>1</sub> = 45 − q<sub>1</sub> = 0 ⇒ q<sub>1</sub> = 45.','Follower: q<sub>2</sub> = (90 − 45)/2 = 22.5. The leader produces the monopoly quantity.','!Stackelberg: plug the follower’s reaction function into the leader’s profit.'],
 ['Bertrand: firms set prices, and the one with the lowest price gets the whole market (homogeneous good).','If p &gt; MC, the rival can set a slightly lower price and take everything.','Undercutting continues until p = MC = 10, where nobody gains from cutting further.','Two firms are enough to give the competitive price.','!Bertrand with homogeneous goods and equal MC: p = MC.'],
 ['In the cartel, the price is above MC for each firm.','Given that the others stick to their quota, one firm gains by selling a bit more: extra sales give p − MC &gt; 0.','Everyone has this incentive, so the agreement is not a Nash equilibrium and breaks down easily.','!Cartel = prisoners’ dilemma: cooperation is best for the group, but cheating is best for each one.'],
 ['With p = a − bQ and MC = c:','Monopoly: Q = (a − c)/(2b) = 0.5·(a − c)/b.','Cournot duopoly: Q = 2·(a − c)/(3b) ≈ 0.67·(a − c)/b.','Competition: p = c ⇒ Q = (a − c)/b = 1·(a − c)/b. Order: monopoly &lt; Cournot &lt; competition.','!More firms in Cournot ⇒ more output, lower price.'],
 ['Cournot with n identical firms: the Lerner index is L = −1/(nε).','Plug in n = 2 and ε = −2: L = −1/(2·(−2)) = 1/4.','L = 0.25. For comparison: monopoly (n = 1) gives 0.5.','!Cournot Lerner = the monopoly’s Lerner divided by the number of firms.'],
 ['Each firm sells a slightly differentiated product and faces a downward-sloping demand curve.','It chooses MR = MC, so p &gt; MC (some market power).','Free entry: profit attracts new firms, which take market share, until profit is 0. Then demand is tangent to AC: p = AC.','Since demand slopes down, the tangency happens where AC is falling: excess capacity.','!Monopolistic competition: p = AC (zero profit), but p &gt; MC.'],
 ['A reaction function (best response) shows firm 1’s optimal quantity for each possible quantity of firm 2.','It is found by maximizing π<sub>1</sub> with respect to q<sub>1</sub> while treating q<sub>2</sub> as given.','The Cournot equilibrium is where the two reaction functions intersect: both play best responses.','!Cournot: differentiate your own profit with respect to your own quantity, solve for your own quantity.']
]
};

<script>
// Question generators for mastery tests, lessons and the practice exam: new numbers every time.
// Each generator returns a question with its own steps (st). Fixed new theory questions use fixed().
const GEN = (function(){
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nf=(x,d=2)=>{const r=Math.round(x*Math.pow(10,d))/Math.pow(10,d);return (r<0?'−':'')+Math.abs(r).toLocaleString('en-US',{maximumFractionDigits:d});};
const co=n=>n===1?'':nf(n); // coefficient: hide 1
const lin=(c,d,v='p')=>(c?c+' + ':'')+co(d)+v; // c + dp
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function num(q,a,tol,e,st){return {t:'num',q,a,tol,e,st};}
function mc(q,right,wrong,e,st){const w=[...new Set(wrong.filter(x=>x!==right))].slice(0,3);return {t:'mc',q,o:[right,...w],a:0,e,st};}
function fixed(o){const f=()=>Object.assign({},o);f.fixed=true;return f;}
const two=x=>nf(x,2);

const G = {
u1:[
 ()=>{const b=R(2,20),d=R(2,20),p=R(2,15),c=R(0,40),Q=c+d*p,a=Q+b*p,askP=Math.random()<.5;
  return num(`Demand: Q = ${a} − ${b}p. Supply: Q = ${lin(c,d)}. What is the equilibrium ${askP?'price':'quantity'}?`,askP?p:Q,0.01,
   `${a} − ${b}p = ${lin(c,d)} gives p = ${p} and Q = ${Q}.`,
   [`Set Q<sub>d</sub> = Q<sub>s</sub>: ${a} − ${b}p = ${lin(c,d)}.`,`Collect p on one side: ${a}${c?' − '+c:''} = ${d}p + ${b}p ⇒ ${a-c} = ${b+d}p.`,`Divide: p = ${a-c}/${b+d} = ${p}.`,`Plug in: Q = ${c?c+' + ':''}${d}·${p} = ${Q}.`,'!Equilibrium: set the functions equal, solve for p, plug p back in for Q.']);},
 ()=>{const b=R(1,8),p=R(2,20),Q=R(10,200),a=b*p+Q,e=-b*p/Q;
  return num(`Demand: Q = ${a} − ${co(b)}p. What is the price elasticity at p = ${p}? (two decimals)`,Math.round(e*100)/100,0.006,
   `Q = ${Q}, ε = −${b}·${p}/${Q} = ${two(e)}.`,
   ['Formula: ε = (dQ/dp)·(p/Q).',`dQ/dp = −${b}.`,`Q at the point: ${a} − ${b}·${p} = ${Q}.`,`ε = −${b}·${p}/${Q} = ${two(e)}. ${e<-1?'Elastic (ε &lt; −1).':'Inelastic (−1 &lt; ε &lt; 0).'}`,'!Elasticity = slope × (p/Q). Compute Q at the point first.']);},
 ()=>{let A,b,c,p,ps,Q;do{A=R(200,1000);b=R(1,5);c=pick([1,2,3,4,5,-1,-2,-3]);p=R(10,50);ps=R(10,80);Q=A-b*p+c*ps;}while(Q<20);
  const e=c*ps/Q;
  return num(`Q = ${A} − ${co(b)}p ${c>0?'+':'−'} ${co(Math.abs(c))}p<sub>s</sub>, where p<sub>s</sub> is the price of another good. At p = ${p} and p<sub>s</sub> = ${ps}: what is the cross-price elasticity? (two decimals)`,Math.round(e*100)/100,0.006,
   `Q = ${Q}. Cross-price elasticity = ${c}·${ps}/${Q} = ${two(e)}.`,
   ['Formula: (∂Q/∂p<sub>s</sub>)·(p<sub>s</sub>/Q).',`∂Q/∂p<sub>s</sub> = ${c}.`,`Q = ${A} − ${b*p} ${c>0?'+':'−'} ${Math.abs(c*ps)} = ${Q}.`,`${c}·${ps}/${Q} = ${two(e)}. ${c>0?'Positive: substitutes.':'Negative: complements.'}`,'!Use the other price in the numerator, but your own quantity Q in the denominator.']);},
 ()=>{const k=pick([0.5,0.8,1.5,2,3]),A=R(2,50);
  return mc(`Demand is Q = ${A}p<sup>−${nf(k)}</sup>. What is the price elasticity?`,`−${nf(k)} at all prices`,[`−${A}`,'It depends on p','−1 at all prices',`−${nf(k*A)}`],
   'For Q = A·p<sup>ε</sup> the elasticity equals the exponent.',
   [`dQ/dp = −${nf(k)}·${A}p<sup>−${nf(k+1)}</sup>.`,`ε = (dQ/dp)·p/Q = −${nf(k)}·${A}p<sup>−${nf(k)}</sup>/(${A}p<sup>−${nf(k)}</sup>) = −${nf(k)}.`,`The constant ${A} and the price p drop out.`,'!Power function ⇒ elasticity = the exponent.']);},
 ()=>{const eta=pick([-0.6,-0.2,0.3,0.7,1.4,2.1]);const ans=eta<0?'Inferior good':eta<1?'Necessity':'Luxury good';
  return mc(`A good has an income elasticity of ${nf(eta,1)}. What kind of good is it?`,ans,['Inferior good','Necessity','Luxury good','Giffen good, always'],
   `${nf(eta,1)} lies in the range for a ${ans.toLowerCase()}.`,
   ['Income elasticity = % change in Q / % change in income.',`Here: ${nf(eta,1)}.`,'Below 0 ⇒ inferior. Between 0 and 1 ⇒ necessity. Above 1 ⇒ luxury.',`Answer: ${ans.toLowerCase()}.`,'!&lt; 0 inferior, 0–1 necessity, &gt; 1 luxury.']);},
 ()=>{const S=[
   ['A poor harvest reduces the supply of coffee. Demand is unchanged.','The price rises, quantity falls','The supply curve shifts left along a downward-sloping demand curve.'],
   ['New technology makes production cheaper. Demand is unchanged.','The price falls, quantity rises','The supply curve shifts right along a downward-sloping demand curve.'],
   ['Incomes fall, and the good is normal. Supply is unchanged.','The price falls, quantity falls','The demand curve shifts left along an upward-sloping supply curve.'],
   ['Both demand and supply increase.','Quantity rises, the price can go either way','Both shifts raise quantity, but they pull the price in opposite directions.'],
   ['Demand increases and supply falls.','The price rises, quantity can go either way','Both shifts raise the price, but they pull quantity in opposite directions.']];
  const s=pick(S),all=['The price rises, quantity falls','The price falls, quantity rises','The price falls, quantity falls','The price rises, quantity rises','Quantity rises, the price can go either way','The price rises, quantity can go either way'];
  return mc(`${s[0]} What happens to the equilibrium?`,s[1],sh(all),s[2],
   ['Work out which curve shifts, and in which direction.',s[2],'Sketch a quick figure: old and new equilibrium.',`Result: ${s[1].toLowerCase()}.`,'!Demand up ⇒ p and Q up. Supply up ⇒ p down, Q up. Two shifts at once ⇒ one variable is ambiguous.']);},
 fixed({t:'mc',q:'Demand is linear: Q = a − bp. Where on the curve is the price elasticity equal to −1?',o:['In the middle of the curve, where p = a/(2b)','Where the curve hits the p axis','Where the curve hits the Q axis','Everywhere'],a:0,e:'ε = −bp/(a − bp) = −1 gives p = a/(2b), the midpoint.',st:['ε = −bp/Q = −bp/(a − bp).','Set equal to −1: bp = a − bp ⇒ p = a/(2b).','Then Q = a/2, i.e. halfway between the intercepts.','Above the midpoint demand is elastic, below it is inelastic.','!Linear demand: elastic at the top, inelastic at the bottom, ε = −1 in the middle.']})
],
u2:[
 ()=>{const a=pick([0.2,0.25,0.3,0.4,0.5,0.6,0.75,0.8]),m=R(4,20)*100,px=pick([2,4,5,8,10,20,25]),x=a*m/px;
  return num(`U = x<sup>${nf(a)}</sup>y<sup>${nf(1-a)}</sup>. Income is ${m} and p<sub>x</sub> = ${px}. How much x is demanded? (two decimals if needed)`,Math.round(x*100)/100,0.006,
   `x = ${nf(a)}·${m}/${px} = ${nf(x)}.`,
   ['Cobb-Douglas with exponents summing to 1: the budget share of x is the x exponent.',`Spending on x: ${nf(a)}·${m} = ${nf(a*m)}.`,`x = ${nf(a*m)}/${px} = ${nf(x)}.`,'(In full: MRS = MRT gives p<sub>y</sub>y = ((1−a)/a)p<sub>x</sub>x, plug into the budget.)','!Cobb-Douglas: x = (a/(a+b))·m/p<sub>x</sub>.']);},
 ()=>{const al=R(1,4),be=R(1,4),py=pick([2,4,5,10]),k=R(5,40),m=(al+be)*k*py,y=be*k;
  return num(`U = x<sup>${al}</sup>y<sup>${be}</sup>. Income is ${m} and p<sub>y</sub> = ${py}. How much y is demanded?`,y,0.01,
   `Share to y = ${be}/${al+be}. y = ${be}/${al+be}·${m}/${py} = ${y}.`,
   ['The exponents do not sum to 1, so normalize: the share going to y is b/(a + b).',`Share: ${be}/(${al} + ${be}) = ${be}/${al+be}.`,`Spending on y: ${be}/${al+be}·${m} = ${y*py}.`,`y = ${y*py}/${py} = ${y}.`,'!Cobb-Douglas: budget share = own exponent / sum of exponents.']);},
 ()=>{const pA=pick([2,3,4,6,8,10,12]),k=pick([2,3,4,5,0.5]),pB=pA/k;
  return num(`Income is ${R(2,9)*100} and p<sub>A</sub> = ${pA}. MRT = −${nf(k)} (${nf(k)} units of B trade for 1 unit of A). What is the price of B? (two decimals if needed)`,Math.round(pB*100)/100,0.006,
   `p<sub>A</sub>/p<sub>B</sub> = ${nf(k)} ⇒ p<sub>B</sub> = ${pA}/${nf(k)} = ${nf(pB)}.`,

 ()=>{const a=pick([0.25,0.4,0.5,0.6]),m=R(4,12)*100,p1=pick([2,4,5,10]),p2=p1*pick([2,4]),x2=a*m/p2;

 ()=>{const th=pick([0.1,0.2,0.25,0.4]),xi=pick([0.5,1,1.5,2,-0.5]),es=pick([-0.2,-0.4,-0.5,-0.8]),e=es-th*xi;

 ()=>{const a=pick([0.3,0.4,0.5,0.7]),k=Math.random()<.5;

 ()=>{const A=pick([2,4,5]),K=R(5,20)*10,r=R(2,10),w=R(5,30),q=A*R(2,10),L=(q/A)**2,C=r*K+w*L;
  return num(`Short run: q = ${A}√L, K = ${K} is fixed, r = ${r} and w = ${w}. What does it cost to produce q = ${q}?`,C,0.01,
   `L = (q/${A})<sup>2</sup> = ${L}. C = ${r}·${K} + ${w}·${L} = ${C}.`,
   [`Solve for L: √L = q/${A} ⇒ L = (q/${A})<sup>2</sup> = q<sup>2</sup>/${A*A}.`,`Cost function: C(q) = ${r}·${K} + ${w}q<sup>2</sup>/${A*A} = ${r*K} + ${nf(w/(A*A))}q<sup>2</sup>.`,`At q = ${q}: L = ${L} and C = ${r*K} + ${w*L} = ${C}.`,'!Short-run cost: solve the production function for L, plug into C = wL + rK̄.']);},
 ()=>{let al,be,w,r;do{al=R(1,5);be=R(1,5);w=R(2,12)*2;r=R(2,12)*2;}while(w/al===r/be);const u=Math.min(w/al,r/be),useL=w/al<r/be;
  return mc(`q = ${co(al)}L + ${co(be)}K, w = ${w} and r = ${r}. What is the long-run cost function?`,`C = ${nf(u)}q`,[`C = ${nf(Math.max(w/al,r/be))}q`,`C = ${nf((w+r)/(al+be))}q`,`C = ${nf(w/al+r/be)}q`],
   `Cheapest per unit: ${useL?'labor':'capital'} at ${nf(u)}.`,
   ['Perfect substitutes: use only the cheapest input.',`Cost per unit with L: w/${al} = ${nf(w/al)}. With K: r/${be} = ${nf(r/be)}.`,`${useL?'Labor':'Capital'} is cheapest, so C = ${nf(u)}q.`,'!Compare price/marginal product for each input.']);},
 ()=>{const [w,r]=pick([[4,1],[9,4],[16,4],[25,4],[8,2],[18,2],[12,3],[20,5],[1,4]]),q=R(5,30)*2,s=Math.sqrt(w*r),C=2*q*s,askL=Math.random()<.5,L=q*Math.sqrt(r/w);
  return num(`q = K<sup>0.5</sup>L<sup>0.5</sup>, w = ${w} and r = ${r}. ${askL?`How much labor L is used when minimizing the cost of q = ${q}?`:`What is the minimum cost of q = ${q}?`}`,askL?L:C,0.01,
   `K/L = w/r = ${nf(w/r)}. L = ${nf(L)}, K = ${nf(q*Math.sqrt(w/r))}, C = ${nf(C)}.`,
   ['Cost minimum: MRTS = −w/r. For K<sup>0.5</sup>L<sup>0.5</sup>, MRTS = −K/L.',`K/L = ${w}/${r} ⇒ K = ${nf(w/r)}L.`,`q = √(K·L) = √(${nf(w/r)})·L = ${nf(Math.sqrt(w/r))}L ⇒ L = ${q}/${nf(Math.sqrt(w/r))} = ${nf(L)}, K = ${nf(q*Math.sqrt(w/r))}.`,`C = ${w}·${nf(L)} + ${r}·${nf(q*Math.sqrt(w/r))} = ${nf(C)}.`,'!Tangency gives the ratio K/L. Plug it into the production function.']);},
 fixed({t:'mc',q:'How does the long-run AC curve relate to the short-run AC curves?',o:['It is a lower envelope: never above any short-run AC','It always lies above','It equals one of them','It crosses all of them at their minimum'],a:0,e:'In the long run the firm can choose the best K for each q.',st:['Each short-run AC curve applies to one fixed K.','In the long run the firm chooses the K that gives the lowest cost for each q.','LRAC is therefore the minimum of all SRAC curves: an envelope curve.','!Long run = more choices ⇒ never more expensive than the short run.']})
],
u7:[
 ()=>{const b=pick([0.5,1,2]),qs=R(5,30),a=R(0,20),p=a+2*b*qs,F=R(5,50)*10,prof=p*qs-F-a*qs-b*qs*qs,askQ=Math.random()<.5;
  return num(`Price-taking firm: p = ${nf(p)} and C(q) = ${F} + ${a?a+'q + ':''}${co(b)}q<sup>2</sup>. ${askQ?'What is the optimal output?':'What is the profit at the optimum?'}`,askQ?qs:prof,0.5,
   `MC = ${a?a+' + ':''}${co(2*b)}q = ${nf(p)} ⇒ q = ${qs}. Profit = ${nf(prof)}.`,
   [`MC = dC/dq = ${a?a+' + ':''}${co(2*b)}q.`,`p = MC: ${nf(p)} = ${a?a+' + ':''}${co(2*b)}q ⇒ q = ${qs}.`,`Revenue: ${nf(p)}·${qs} = ${nf(p*qs)}. Cost: ${F} + ${a*qs} + ${nf(b*qs*qs)} = ${nf(F+a*qs+b*qs*qs)}.`,`Profit: ${nf(prof)}.${prof<0?' Negative, but the firm produces as long as p ≥ AVC.':''}`,'!Competition: p = MC gives q. π = pq − C(q).']);},
 ()=>{const k=pick([2,4,6,8]),m=k*k/4+R(2,20),minA=m-k*k/4,F=R(10,100),p=Math.random()<.5?minA+R(1,8):Math.max(1,minA-R(1,Math.min(8,minA-1)));const prod=p>=minA;
  return {t:'mc',q:`C(q) = ${F} + q<sup>3</sup> − ${k}q<sup>2</sup> + ${m}q. The market price is ${p}. What does the firm do in the short run?`,o:['Produces','Shuts down (produces 0)'],a:prod?0:1,
   e:`Min AVC = ${minA}. The price is ${prod?'above':'below'} it.`,
   st:[`AVC = VC/q = q<sup>2</sup> − ${k}q + ${m}.`,`Min AVC: 2q − ${k} = 0 ⇒ q = ${k/2}. AVC(${k/2}) = ${k*k/4} − ${k*k/2} + ${m} = ${minA}.`,`The price ${p} is ${prod?'greater than or equal to':'less than'} min AVC = ${minA}.`,prod?'The firm covers its variable costs and produces where p = MC.':'The firm loses less by shutting down (it only loses F).','!Short-run shutdown rule: produce if p ≥ min AVC.']};},
 ()=>{const b=pick([0.5,1,2,4]),k=R(2,15)*2,F=b*k*k;
  return num(`All firms in an industry have C(q) = ${co(b)}q<sup>2</sup> + ${nf(F)}. What is the price in long-run equilibrium?`,2*b*k,0.01,
   `p = min AC = ${nf(2*b*k)} (at q = ${k}).`,
   ['Long run with free entry: p = min AC.',`AC = ${co(b)}q + ${nf(F)}/q. Differentiate: ${nf(b)} − ${nf(F)}/q<sup>2</sup> = 0 ⇒ q = ${k}.`,`Min AC = ${nf(b*k)} + ${nf(F/k)} = ${nf(2*b*k)}.`,'!Long-run equilibrium price = minimum of AC.']);},
 ()=>{const b=pick([0.5,1,2]),qs=R(5,30),a=R(0,20),t=R(1,10),p=a+t+2*b*qs;
  return num(`Price-taking firm: p = ${nf(p)}, MC = ${a?a+' + ':''}${co(2*b)}q, and a specific tax of ${t} per unit. What is the optimal output?`,qs,0.01,
   `p = MC + t ⇒ q = ${qs}.`,
   ['The tax makes every unit t more expensive: effective MC = MC + t.',`${nf(p)} = ${a?a+' + ':''}${co(2*b)}q + ${t}.`,`${co(2*b)}q = ${nf(p-a-t)} ⇒ q = ${qs}.`,'!Specific tax for a price-taking firm: p = MC + t.']);},
 ()=>{const p=R(5,20),n=pick([10,20,50,100]),B=R(1,10),A=p*(B+n/2);
  return num(`A market has ${n} identical firms with C(q) = q<sup>2</sup> (MC = 2q). Demand is Q = ${A} − ${co(B)}p. What is the equilibrium price?`,p,0.01,
   `Market supply Q = ${n/2}p. ${A} − ${B}p = ${n/2}p ⇒ p = ${p}.`,
   ['Each firm: p = MC = 2q ⇒ q = p/2.',`Market supply: Q<sub>s</sub> = ${n}·p/2 = ${n/2}p.`,`Equilibrium: ${A} − ${B}p = ${n/2}p ⇒ ${A} = ${B+n/2}p ⇒ p = ${p}.`,`Each firm produces q = ${nf(p/2)}.`,'!Market supply = number of firms × individual supply (horizontal summation).']);},
 fixed({t:'mc',q:'An industry has constant costs (firms’ costs do not change as the industry grows). What does the long-run supply curve look like?',o:['Horizontal at p = min AC','Upward-sloping','Downward-sloping','Vertical'],a:0,e:'Entry continues until the price is back at min AC, whatever the quantity.',st:['Higher demand gives a higher price and profit in the short run.','New firms enter until the price again equals min AC.','When costs do not change, min AC is the same however large the industry is.','Long-run supply is therefore horizontal at min AC.','!Constant costs ⇒ horizontal long-run supply.']}),
 fixed({t:'tf',q:'Statement: Zero economic profit means the owners earn nothing.',a:false,e:'Economic profit subtracts opportunity costs. Accounting profit can still be positive.',st:['Economic profit = revenue − explicit − implicit costs.','Implicit costs include the return the owners could have earned elsewhere.','Zero economic profit means the owners get exactly as much as in their best alternative.','The statement is <b>false</b>.','!Zero economic profit = a normal return.']})
],
u8:[
 ()=>{let b,d,t,pb,a,Q1;do{b=R(1,5);d=R(1,5);t=R(2,10);pb=R(10,40);a=pb*(b+d)-d*t;Q1=a-b*pb;}while(Q1<=0||pb<=t);
  const p0=a/(b+d),Q0=d*p0,dwl=0.5*t*(Q0-Q1),askP=Math.random()<.5;
  return num(`Demand: Q = ${a} − ${co(b)}p. Supply: Q = ${co(d)}p. A tax of ${t} per unit is levied on sellers. ${askP?'What price do consumers pay?':'What is the deadweight loss? (two decimals if needed)'}`,askP?pb:Math.round(dwl*100)/100,askP?0.01:0.006,
   `Consumer price ${pb}, seller price ${pb-t}, Q = ${Q1}. DWL = ${nf(dwl)}.`,
   [`Sellers receive p − ${t}: supply Q = ${d}(p − ${t}).`,`Equilibrium: ${a} − ${b}p = ${d}p − ${d*t} ⇒ ${a+d*t} = ${b+d}p ⇒ p = ${pb}.`,`Without the tax: p = ${a}/${b+d} = ${nf(p0)}, Q = ${nf(Q0)}. With the tax: Q = ${Q1}.`,`DWL = ½·t·ΔQ = ½·${t}·${nf(Q0-Q1)} = ${nf(dwl)}.`,'!Tax on sellers: replace p with (p − t) in supply. DWL = ½·t·ΔQ.']);},
 ()=>{const b=R(1,5),d=R(1,5),ps=R(6,20),a=(b+d)*ps,pc=ps-R(1,4),Qs=d*pc,pd=(a-Qs)/b,Qs0=d*ps,dwl=0.5*(Qs0-Qs)*(pd-pc),askS=Math.random()<.5,short=a-b*pc-Qs;
  return num(`Demand: Q = ${a} − ${co(b)}p. Supply: Q = ${co(d)}p. A price ceiling of ${pc} is introduced. ${askS?'How large is the excess demand (shortage)?':'What is the deadweight loss? (two decimals if needed)'}`,askS?short:Math.round(dwl*100)/100,askS?0.01:0.006,
   `Equilibrium p = ${ps}. At ${pc}: Q<sub>s</sub> = ${Qs}, Q<sub>d</sub> = ${a-b*pc}. DWL = ${nf(dwl)}.`,
   [`Equilibrium: ${a} − ${b}p = ${d}p ⇒ p = ${ps}, Q = ${Qs0}. The ceiling (${pc}) binds.`,`At p = ${pc}: quantity supplied Q<sub>s</sub> = ${Qs}, quantity demanded Q<sub>d</sub> = ${a-b*pc}. Shortage: ${short}.`,`Willingness to pay for unit number ${Qs}: p = (${a} − ${Qs})/${b} = ${nf(pd)}.`,`DWL = ½·(${Qs0} − ${Qs})·(${nf(pd)} − ${pc}) = ${nf(dwl)}.`,'!Price ceiling: quantity traded = Q<sub>s</sub>(p̄). DWL triangle between the curves from Q<sub>s</sub> to equilibrium.']);},
 ()=>{const b=R(1,6),d=R(1,6),t=R(2,12),v=t*d/(b+d);
  return num(`Demand: Q = 200 − ${co(b)}p. Supply: Q = ${co(d)}p. A tax of ${t} is introduced. By how much does the price consumers pay rise? (two decimals if needed)`,Math.round(v*100)/100,0.006,
   `Δp = t·${d}/(${b} + ${d}) = ${nf(v)}.`,
   [`With the tax: 200 − ${b}p = ${d}(p − ${t}) ⇒ p = (200 + ${d*t})/${b+d}.`,`Without the tax: p = 200/${b+d}.`,`Increase: ${d*t}/${b+d} = ${nf(v)}.`,`Consumers bear ${nf(d/(b+d)*100,0)}% of the tax. ${d>b?'Supply is the more price-sensitive side, so consumers bear most.':d<b?'Demand is the more price-sensitive side, so sellers bear most.':'Equally sensitive ⇒ shared equally.'}`,'!The least price-sensitive side bears most of the tax.']);},
 ()=>{const b=R(1,5),d=R(1,5),ps=R(6,20),a=(b+d)*ps,pf=ps+R(1,6),surplus=d*pf-(a-b*pf);
  return num(`Demand: Q = ${a} − ${co(b)}p. Supply: Q = ${co(d)}p. A price floor of ${pf} is introduced. How large is the excess supply?`,surplus,0.01,
   `Q<sub>s</sub> = ${d*pf}, Q<sub>d</sub> = ${a-b*pf}, surplus ${surplus}.`,
   [`Equilibrium: p = ${ps}. The floor of ${pf} is above it, so it binds.`,`Supply at ${pf}: ${d}·${pf} = ${d*pf}.`,`Demand at ${pf}: ${a} − ${b}·${pf} = ${a-b*pf}.`,`Excess supply: ${d*pf} − ${a-b*pf} = ${surplus}.`,'!Price floor above equilibrium ⇒ Q<sub>s</sub> &gt; Q<sub>d</sub>.']);},
 fixed({t:'tf',q:'Statement: A per-unit subsidy to producers creates a deadweight loss in an otherwise well-functioning competitive market.',a:true,e:'The subsidy leads to too much output: units where MC is higher than willingness to pay.',st:['The subsidy lowers effective MC, so quantity rises beyond equilibrium.','For the extra units, the cost (MC) is higher than their value to consumers.','The cost of the subsidy to the government is larger than the gain to consumers and producers combined. The difference is DWL.','The statement is <b>true</b>.','!Both taxes and subsidies move quantity away from the efficient equilibrium ⇒ DWL.']}),
 fixed({t:'mc',q:'Demand for cigarettes is very inelastic, while supply is elastic. Who bears most of a cigarette tax?',o:['Consumers','Producers','They share it equally','The government'],a:0,e:'The least elastic side bears most.',st:['The tax creates a wedge between the buyer and seller price.','Buyers have few alternatives (inelastic), so they cut back their purchases very little.','Sellers can easily reduce supply (elastic), so the seller price falls little.','The buyer price rises by almost the whole tax.','!The inelastic side bears the burden.']})
],
u9:[
 ()=>{let p1,p2,a,b;do{p1=R(3,15);p2=R(3,15);a=3*p1-p2;b=3*p2-p1;}while(a<=0||b<=0);const ask1=Math.random()<.5;
  return num(`Q<sub>1</sub><sup>d</sup> = ${a} − 2p<sub>1</sub> + p<sub>2</sub>, Q<sub>1</sub><sup>s</sup> = p<sub>1</sub>. Q<sub>2</sub><sup>d</sup> = ${b} − 2p<sub>2</sub> + p<sub>1</sub>, Q<sub>2</sub><sup>s</sup> = p<sub>2</sub>. What is p<sub>${ask1?1:2}</sub> in equilibrium?`,ask1?p1:p2,0.01,
   `p<sub>1</sub> = ${p1}, p<sub>2</sub> = ${p2}.`,
   [`Market 1: ${a} − 2p<sub>1</sub> + p<sub>2</sub> = p<sub>1</sub> ⇒ 3p<sub>1</sub> − p<sub>2</sub> = ${a}.`,`Market 2: 3p<sub>2</sub> − p<sub>1</sub> = ${b}.`,`From market 1: p<sub>2</sub> = 3p<sub>1</sub> − ${a}. Plug in: 3(3p<sub>1</sub> − ${a}) − p<sub>1</sub> = ${b} ⇒ 8p<sub>1</sub> = ${3*a+b} ⇒ p<sub>1</sub> = ${p1}.`,`p<sub>2</sub> = 3·${p1} − ${a} = ${p2}.`,'!Two markets ⇒ two equations. Solve by substitution.']);},
 ()=>{const buy=R(10,40),sell=buy+pick([-1,1])*R(3,9),g=pick(['X','Y']),ex=buy>sell;
  return mc(`Mara and Nils trade ${g} and ${g==='X'?'Y':'X'}. At current prices Mara wants to buy ${buy} units of ${g}, while Nils wants to sell ${sell}. What must happen to reach equilibrium?`,ex?`The relative price of ${g} must rise`:`The relative price of ${g} must fall`,[`The relative price of ${g} must rise`,`The relative price of ${g} must fall`,'Nothing, this is an equilibrium','Nils must get more of both goods'],
   `${ex?'Excess demand':'Excess supply'} of ${g}.`,
   ['In equilibrium, desired purchases must equal desired sales for each good.',`Buy ${buy}, sell ${sell} ⇒ ${ex?'excess demand':'excess supply'} of ${Math.abs(buy-sell)}.`,ex?`The price of ${g} must rise: Mara buys less, Nils sells more.`:`The price of ${g} must fall: Mara buys more, Nils sells less.`,'!Excess demand ⇒ price up. Excess supply ⇒ price down.']);},
 ()=>{const X=pick([20,40,60]),Y=pick([20,40,60]),eff=Math.random()<.5;let x1=R(2,X/2-1)*2,y1=eff?x1*Y/X:R(2,Y-2);if(!eff&&y1*X===x1*Y)y1+=1;
  const m1=y1/x1,m2=(Y-y1)/(X-x1),isEff=Math.abs(m1-m2)<1e-9;
  return mc(`Two people with U = xy share ${X} units of X and ${Y} units of Y. Person 1 has (x, y) = (${x1}, ${nf(y1)}), person 2 has the rest. Is the allocation Pareto efficient?`,isEff?'Yes, the MRS is equal for both':'No, the MRS differs, so both can gain from trade',['Yes, the MRS is equal for both','No, the MRS differs, so both can gain from trade','Yes, because everything is allocated','No, because the allocation is unequal'],
   `MRS<sub>1</sub> = ${nf(m1)}, MRS<sub>2</sub> = ${nf(m2)}.`,
   ['Pareto efficient in the Edgeworth box ⇔ MRS<sub>1</sub> = MRS<sub>2</sub>.','For U = xy, |MRS| = y/x.',`Person 1: ${nf(y1)}/${x1} = ${nf(m1)}. Person 2: (${Y} − ${nf(y1)})/(${X} − ${x1}) = ${nf(Y-y1)}/${X-x1} = ${nf(m2)}.`,isEff?'Equal ⇒ the indifference curves are tangent ⇒ efficient.':'Different ⇒ the curves cross, and there are trades that make both better off.','!Efficiency is checked with the MRS, not with how equally the goods are split.']);},
 fixed({t:'mc',q:'What does the second welfare theorem say?',o:['Any Pareto efficient allocation can be reached as a competitive equilibrium after a suitable redistribution of endowments','The competitive equilibrium is always fair','Monopoly can be Pareto efficient','Redistribution always creates deadweight loss'],a:0,e:'Efficiency and distribution can in principle be separated.',st:['First theorem: competition ⇒ Pareto efficiency.','Second theorem: choose the desired efficient point, redistribute endowments (lump sum), and let the market do the rest.','The point: the government does not need to control prices to achieve a desired distribution.','!2nd theorem: redistribute endowments, not prices.']}),
 fixed({t:'mc',q:'What does the utility possibility frontier show?',o:['The highest possible utility for one person given the other’s utility','All possible price ratios','The endowments','The production possibilities of the economy'],a:0,e:'It is the contract curve drawn in utility space.',st:['Each point on the contract curve gives a pair of utility levels (U<sub>1</sub>, U<sub>2</sub>).','Plotting these pairs gives the utility possibility frontier.','All points on it are Pareto efficient. Points inside are inefficient.','!Utility possibility frontier = the Pareto frontier in utilities.']})
],
u10:[
 ()=>{const b=pick([0.5,1,2,4]),Q=R(5,40),c=R(2,30),a=c+2*b*Q,p=a-b*Q,F=R(0,20)*10,which=pick(['Q','p','pi']),pi=(p-c)*Q-F;
  return num(`Monopoly: p = ${a} − ${co(b)}Q and C(Q) = ${F?F+' + ':''}${c}Q. ${which==='Q'?'What is the profit-maximizing quantity?':which==='p'?'What price does the monopoly set?':'What is the profit?'}`,which==='Q'?Q:which==='p'?p:pi,0.5,
   `MR = ${a} − ${co(2*b)}Q = ${c} ⇒ Q = ${Q}, p = ${nf(p)}, π = ${nf(pi)}.`,
   [`MR = ${a} − ${co(2*b)}Q (twice the slope). MC = ${c}.`,`MR = MC: ${a} − ${co(2*b)}Q = ${c} ⇒ Q = ${nf(a-c)}/${nf(2*b)} = ${Q}.`,`Price from demand: p = ${a} − ${nf(b)}·${Q} = ${nf(p)}.`,`Profit: (${nf(p)} − ${c})·${Q}${F?' − '+F:''} = ${nf(pi)}.`,'!Q from MR = MC, p from the demand curve.']);},
 ()=>{const e=pick([-1.5,-2,-3,-4,-5,-6]),mcv=R(2,20)*2,askP=Math.random()<.5,p=mcv/(1+1/e),L=-1/e;
  return num(askP?`A monopoly faces an elasticity of ${nf(e)} at its optimum and MC = ${mcv}. What is the price? (two decimals if needed)`:`A monopoly faces an elasticity of ${nf(e)} at its optimum. What is the Lerner index? (two decimals)`,Math.round((askP?p:L)*100)/100,0.006,
   askP?`p = ${mcv}/(1 + 1/(${nf(e)})) = ${nf(p)}.`:`L = −1/ε = ${nf(L)}.`,
   ['Monopoly rule: MR = p(1 + 1/ε) = MC.',`1/ε = ${nf(1/e,3)}, so 1 + 1/ε = ${nf(1+1/e,3)}.`,askP?`p = MC/(1 + 1/ε) = ${mcv}/${nf(1+1/e,3)} = ${nf(p)}.`:`Lerner: (p − MC)/p = −1/ε = ${nf(L)}.`,'!p = MC/(1 + 1/ε) and L = −1/ε.']);},
 ()=>{const b=pick([0.5,1,2]),Q=R(5,30),c=R(2,30),a=c+2*b*Q,dwl=0.5*b*Q*Q;
  return num(`Monopoly: p = ${a} − ${co(b)}Q and MC = ${c}. How large is the deadweight loss compared with the competitive outcome?`,dwl,0.5,
   `Monopoly Q = ${Q}, competition Q = ${2*Q}. DWL = ${nf(dwl)}.`,
   [`Monopoly: MR = ${a} − ${co(2*b)}Q = ${c} ⇒ Q = ${Q}, p = ${nf(a-b*Q)}.`,`Competition: p = MC ⇒ ${a} − ${co(b)}Q = ${c} ⇒ Q = ${2*Q}.`,`DWL triangle: ½·(${2*Q} − ${Q})·(${nf(a-b*Q)} − ${c}) = ${nf(dwl)}.`,'!Linear demand, constant MC: the monopoly produces half the competitive quantity.']);},
 ()=>{const b=pick([1,2]),Q=R(10,30),c=R(2,20),t=R(1,6)*2,a=c+2*b*Q,p=a-b*Q,p2=p+t/2;
  return num(`Monopoly: p = ${a} − ${co(b)}Q, MC = ${c}. A specific tax of ${t} is introduced. What price does the monopoly set now?`,p2,0.01,
   `New MC = ${c+t}. Q = ${nf((a-c-t)/(2*b))}, p = ${nf(p2)}.`,
   [`The tax raises MC to ${c} + ${t} = ${c+t}.`,`MR = ${a} − ${2*b}Q = ${c+t} ⇒ Q = ${nf((a-c-t)/(2*b))}.`,`p = ${a} − ${b}·${nf((a-c-t)/(2*b))} = ${nf(p2)}.`,`Before the tax p = ${nf(p)}. Increase: ${nf(t/2)} = half the tax.`,'!Linear demand + constant MC ⇒ the price rises by t/2.']);},
 ()=>{const k=pick([0.5,1,1.5,2]),Q=R(5,25),a=Q*(2+2*k);
  return num(`Monopoly: p = ${a} − Q and C(Q) = ${co(k)}Q<sup>2</sup>. What is the profit-maximizing quantity?`,Q,0.01,
   `MR = ${a} − 2Q = ${co(2*k)}Q ⇒ Q = ${Q}.`,

function cur(){return L.queue[0];}
function renderQ(){

function progress(){

function parseNum(s){s=s.replace(/\s/g,'').replace(/−/g,'-');if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return parseFloat(s);}
function check(){
  if(L.sel==null||L.state!=='ask')return;
  const {q,retry}=cur(); let ok, ansTxt;
  if(q.t==='tf'){ok=(L.sel==='1')===q.a; ansTxt=q.a?'True':'False';}
  else if(q.t==='mc'){ok=+L.sel===q.a; ansTxt=q.o[q.a];}
  else {const v=parseNum(L.sel); ok=!isNaN(v)&&Math.abs(v-q.a)<=q.tol+1e-9; ansTxt=fmt(q.a);}
  L.state='fb'; L.revealed=true; L.lastOk=ok;
  // marker valg
  const qw=document.getElementById('qw');
  qw.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const isRight=(q.t==='tf')?((b.dataset.v==='1')===q.a):(+b.dataset.v===q.a);
    if(isRight) b.classList.add('right'); else if(b.classList.contains('sel')) b.classList.add('wrong');
  });
  const inp=document.getElementById('numA'); if(inp){inp.disabled=true;inp.style.borderColor=ok?'var(--ok)':'var(--bad)';}
  if(!retry){ L.answered++; const pu=L.perUnit[q.unit]=L.perUnit[q.unit]||{c:0,n:0}; pu.n++; if(ok){pu.c++;L.correctFirst++;} }
  if(ok){
    if(L.mode==='review') delete S.wrong[q.id];
  } else {
    if(!q.gen) S.wrong[q.id]=(S.wrong[q.id]||0)+1; L.missed.add(q.id);
    if(L.hearts!=null) L.hearts--;
  }

  // queue
  const item=L.queue.shift();
  if(ok||L.mode==='exam') L.solved++;
  else if(L.mode!=='exam') L.queue.push({q:item.q.make?item.q.make():item.q,retry:true});
  progress();
  const lf=document.getElementById('lf'); lf.className='lfoot '+(ok?'ok':'bad');
  const praise=['Spot on!','Brilliant!','That’s the way!','Nice work!','Exactly!'];
  const st=q.st||(STEPS[UNITS[q.unit].id]||[])[q.id.split('-')[1]]||[];
  const steps=st.filter(x=>x[0]!=='!'), rule=st.find(x=>x[0]==='!');
