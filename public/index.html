<style>
:root{
  /* Playful learning path: bold unit colors on a calm, cool background. One column, centered path. */
  --bg:#f3f5fa; --surface:#ffffff; --ink:#1d2433; --muted:#667085; --line:#dfe3ec;
  --accent:#2f5bd8; --accent-d:#1f43a8; --gold:#f0a500; --ok:#2e9e4f; --ok-bg:#e3f5e8; --bad:#d6453d; --bad-bg:#fde8e6;
  --lock:#c9cfdb;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151d; --surface:#1a202b; --ink:#e8ecf4; --muted:#98a2b6; --line:#2b3342;
    --accent:#6b8cff; --accent-d:#4a6be0; --gold:#ffc23d; --ok:#4cc46d; --ok-bg:#16301f; --bad:#ff6b61; --bad-bg:#3a1c1a; --lock:#38404f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --ink:#e8ecf4; --muted:#98a2b6; --line:#2b3342;
  --accent:#6b8cff; --accent-d:#4a6be0; --gold:#ffc23d; --ok:#4cc46d; --ok-bg:#16301f; --bad:#ff6b61; --bad-bg:#3a1c1a; --lock:#38404f;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
sub,sup{line-height:0}

.app{max-width:640px;margin:0 auto;padding:0 16px 96px;min-height:100%}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:2px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:1.45rem;color:var(--accent);letter-spacing:-.01em}
.brand small{font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:700;margin-left:6px}
.stats{display:flex;gap:14px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:4px}
.stat svg{width:22px;height:22px}
.stat.streak{color:#f07a1a}.stat.xp{color:var(--gold)}.stat.mist{color:var(--bad)}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:14px 0 6px}
@media (max-width:620px){.tabs{grid-template-columns:repeat(6,1fr)}.tabs .tab{grid-column:span 2}.tabs .tab:nth-child(n+4){grid-column:span 3}.tabs .tab{font-size:.84rem;padding:8px 4px}}
.tab{min-width:0;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;padding:9px 10px;font-weight:800;font-size:.92rem;border-bottom-width:4px}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

.goal{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.goal b{font-family:var(--display);font-size:1.05rem}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
.goal span{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}

.unit{margin:26px 0 8px}
.ubanner{border-radius:18px;padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:5px solid rgba(0,0,0,.18)}
.ubanner .k{font-weight:800;font-size:.78rem;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
.ubanner h2{font-size:1.4rem;color:#fff}
.ubanner .pr{font-size:.85rem;font-weight:700;opacity:.92}
.guide{border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:6px}
.guide svg{width:18px;height:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0 6px}
.node{width:74px;height:70px;border-radius:50%;border:none;display:grid;place-items:center;color:#fff;position:relative;box-shadow:0 7px 0 var(--sh);transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.node svg{width:32px;height:32px}
.node.locked{background:var(--lock)!important;--sh:color-mix(in srgb,var(--lock) 70%,#000)!important;color:var(--muted);cursor:not-allowed}
.node.done::after{content:'';position:absolute;inset:-7px;border-radius:26px;border:4px solid var(--gold)}
.ring{padding:6px;border-radius:50%;background:conic-gradient(var(--gold) var(--p),var(--line) 0)}
.ring.off{background:none}
.lvn{position:absolute;right:-4px;bottom:-4px;min-width:24px;height:24px;border-radius:99px;background:var(--surface);color:var(--ink);border:2px solid var(--line);font-size:.78rem;font-weight:800;display:grid;place-items:center;padding:0 5px}
.nodewrap .lbl{margin-top:12px;font-size:.78rem;font-weight:800;color:var(--muted);white-space:nowrap}
.lvtag{font-size:.7rem;font-weight:800;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:1px 8px;margin-top:3px}
.lvtag.m{color:color-mix(in srgb,var(--gold) 55%,var(--ink));border-color:var(--gold)}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 8px}
.pips i{height:12px;border-radius:99px;background:var(--line)}
.pips i.on{background:var(--gold)}
.lvline{margin:0 0 16px;color:var(--muted)}
.lvline b{color:var(--ink)}
.nodewrap{display:flex;flex-direction:column;align-items:center;margin-bottom:4px}
.node.boss{width:84px;height:80px;border-radius:22px}

/* Lesson */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.lhead{max-width:680px;width:100%;margin:0 auto;padding:16px;display:flex;align-items:center;gap:14px}
.x{background:none;border:none;color:var(--muted);padding:4px;display:grid;place-items:center}
.x svg{width:26px;height:26px}
.lhead .bar{height:16px}
.lhead .bar>i{background:var(--ok)}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--bad);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.lbody{flex:1;overflow:auto}
.qwrap{max-width:640px;margin:0 auto;padding:8px 16px 24px}
.qtag{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:8px}
.qtag .ex{background:color-mix(in srgb,var(--gold) 22%,transparent);color:color-mix(in srgb,var(--gold) 60%,var(--ink));padding:2px 8px;border-radius:99px}
.qtext{font-size:1.18rem;font-weight:700;margin:0 0 20px;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-size:1rem;font-weight:600;display:flex;gap:12px;align-items:center}
.opt .n{flex:none;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--muted)}
.opt:hover{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.sel .n{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font-size:1.05rem;font-weight:800}
.numin{display:flex;gap:10px;align-items:center}
.numin input{flex:1;font:inherit;font-size:1.3rem;font-weight:800;padding:14px 16px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
table.payoff{border-collapse:collapse;margin:12px 0;font-size:.92rem;font-weight:700}
table.payoff th,table.payoff td{border:2px solid var(--line);padding:6px 10px;text-align:center}
table.payoff td{font-variant-numeric:tabular-nums;background:var(--surface)}

.lfoot{border-top:2px solid var(--line);background:var(--surface)}
.lfoot.ok{background:var(--ok-bg);border-color:transparent}
.lfoot.bad{background:var(--bad-bg);border-color:transparent}
.lfoot .in{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.fb h3{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.lfoot.ok .fb h3{color:var(--ok)}.lfoot.bad .fb h3{color:var(--bad)}
.fb h3 svg{width:28px;height:28px}
.fb{max-height:56vh;overflow:auto;padding-right:4px}
.fb p{margin:4px 0 0;font-size:.97rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.cmp>div{background:var(--surface);border-radius:12px;padding:8px 10px;font-weight:700;font-size:.92rem;border-left:5px solid var(--bad)}
.cmp>div+div{border-left-color:var(--ok)}
.cmp span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.sol{background:var(--surface);border-radius:14px;padding:12px 14px;margin-top:10px}
.solh{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--ink)}
.steps{margin:6px 0 0;padding-left:0;list-style:none;counter-reset:st;display:grid;gap:8px}
.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:.95rem;color:var(--ink)}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:.78rem;display:grid;place-items:center;margin-top:1px}
.rule{margin-top:12px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-radius:10px;padding:8px 12px;font-size:.93rem;color:var(--ink)}
.rule b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--gold) 55%,var(--ink))}
.more{margin-top:8px;background:none;border:2px solid color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.88rem}
@media (max-width:420px){.cmp{grid-template-columns:1fr}}
.btn{border:none;border-radius:14px;padding:14px 18px;font-weight:800;font-size:1.02rem;text-transform:uppercase;letter-spacing:.04em;background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d);width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn:disabled{background:var(--lock);box-shadow:0 4px 0 color-mix(in srgb,var(--lock) 70%,#000);color:var(--muted);cursor:not-allowed}
.lfoot.ok .btn{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 70%,#000)}
.lfoot.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

.result{max-width:520px;margin:0 auto;padding:40px 16px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.result h2{font-size:2rem;color:var(--gold)}
.result.fail h2{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.tile .h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px;color:#fff}
.tile .v{font-family:var(--display);font-size:1.6rem;font-weight:800;padding:6px;font-variant-numeric:tabular-nums}
.medal{width:120px;height:120px}

/* Panels */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.panel h2{font-size:1.35rem;margin-bottom:6px}
.panel p{margin:6px 0;color:var(--muted)}
.panel .btn{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.85rem}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.ftable{width:100%;border-collapse:collapse;font-size:.95rem}
.ftable td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.ftable td:first-child{color:var(--muted);font-weight:700;width:42%}
.ftable td:last-child{font-weight:700}
.breakdown{width:100%;text-align:left;display:grid;gap:6px}
.brow{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;font-size:.9rem;font-weight:700}
.brow .bar{height:10px}
.brow .bar>i{background:var(--accent)}

/* Guide sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .card{background:var(--surface);width:100%;max-width:640px;max-height:85%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 28px}
.sheet h2{font-size:1.5rem}
.sheet ul{padding-left:20px;margin:14px 0}
.sheet li{margin:10px 0}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;color:var(--muted);padding:20px}
@media (max-width:420px){.qtext{font-size:1.08rem}.ubanner h2{font-size:1.2rem}.guide span{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}

/* Accounts */
.auth{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:none;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
body.show-auth .auth{display:flex}
.aclose{position:absolute;top:10px;right:10px}
.acard{position:relative;margin:auto;width:100%;max-width:400px;background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:26px 22px}
.acard .brand{font-size:2.1rem;text-align:center}
.acard .brand small{display:block;margin:0;font-size:.85rem}
.atag{text-align:center;color:var(--muted);font-weight:700;margin:6px 0 18px}
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.atabs[hidden]{display:none}
.afield{display:grid;gap:5px;margin-bottom:12px}
.afield[hidden]{display:none}
.afield label{font-weight:800;font-size:.85rem}
.afield input{font:inherit;font-size:1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--bg);color:var(--ink)}
.amsg{min-height:1.4em;font-weight:700;font-size:.9rem;margin:2px 0 10px;color:var(--muted)}
.amsg.err{color:var(--bad)}.amsg.ok{color:var(--ok)}
.alinks{display:flex;justify-content:center;margin-top:14px}
.alinks button{background:none;border:none;color:var(--accent);font-weight:800;font-size:.9rem;padding:4px}
.alinks button[hidden]{display:none}
.acct{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--accent);font-family:var(--display);font-weight:800;font-size:1rem;display:grid;place-items:center;position:relative;padding:0;flex:none}
.acct i{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--ok)}
.acct.guest{width:auto;border-radius:99px;padding:0 12px;font-family:var(--body);font-size:.85rem;color:#fff;background:var(--accent);border-color:var(--accent)}
.acct.guest i{display:none}
/* Larger screens: wider column, everything scaled up, dialogs centered */
@media (min-width:1000px){
  .app{max-width:800px}
  .lhead{max-width:840px}
  .qwrap,.lfoot .in{max-width:800px}
  .sheet{align-items:center;padding:24px}
  .sheet .card{max-width:640px;border-radius:22px}
}
@media (min-width:1280px){ body{zoom:1.15} }
@media (min-width:1700px){ body{zoom:1.3} }
.foot{display:flex;justify-content:center;gap:18px;margin:40px 0 0;font-size:.85rem;font-weight:700}
.foot a,.foot button{color:var(--muted);background:none;border:none;padding:0;font:inherit;text-decoration:underline;text-underline-offset:3px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;text-transform:none;letter-spacing:0}
.aor{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:.82rem;margin:16px 0 12px}
.aor::before,.aor::after{content:'';flex:1;height:2px;background:var(--line)}
.apriv{text-align:center;color:var(--muted);font-size:.8rem;margin:10px 0 0}.apriv a{color:var(--muted)}
.exam{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:12px 0}
.exam svg{width:30px;height:30px;flex:none;color:var(--accent)}
.exam .tx{flex:1;min-width:0}.exam b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.2}
.exam small{color:var(--muted);font-weight:700;font-size:.85rem}
.exam input{font:inherit;font-weight:700;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-top:4px;max-width:100%}
.link{background:none;border:none;color:var(--accent);font-weight:800;font-size:.85rem;padding:4px;white-space:nowrap}
.rep{margin-top:8px;background:none;border:none;color:var(--muted);font-weight:700;font-size:.82rem;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
.rchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.rtext{width:100%;min-height:90px;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.board{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;counter-reset:rk}
.board li{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--bg);font-weight:800}
.board li .rk{font-family:var(--display);font-size:1.1rem;color:var(--muted);text-align:center}
.board li:nth-child(1) .rk{color:var(--gold)}.board li:nth-child(2) .rk{color:#9aa4b5}.board li:nth-child(3) .rk{color:#c0773a}
.board li.me{background:color-mix(in srgb,var(--accent) 14%,var(--surface));outline:2px solid var(--accent)}
.board li .xp{color:var(--gold);font-variant-numeric:tabular-nums}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbjoin{display:flex;gap:8px;margin-top:10px}
.lbjoin input{flex:1;min-width:0;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.lbjoin .btn{width:auto;margin:0}
.danger{background:var(--bad)!important;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)!important;color:#fff!important;border:none!important}
.acct i.saving{background:var(--gold)}.acct i.err{background:var(--bad)}
@media (max-width:400px){.stats{gap:9px}.brand small{display:none}}
</style>

<script>
// Question bank SE-213 Microeconomics (Perloff, ch. 1–11 and 13–14)
// t: 'mc' multiple choice (a = index of correct), 'tf' statement (a = true/false), 'num' numeric (a, tol)
// ex: true = based on a past exam question
const UNITS = [
{
  id: 'u1', title: 'Supply and Demand', ch: 'Ch. 1–2',
  theory: [
    'The demand function Q = D(p, p<sub>s</sub>, Y) falls in its own price. A change in own price is a <b>movement along</b> the curve; a change in income, other prices or tastes <b>shifts</b> the curve.',
    'Equilibrium: set Q<sub>d</sub> = Q<sub>s</sub> and solve for p. Plug p back in to find Q.',
    'Price elasticity: ε = (dQ/dp)·(p/Q). Elastic if ε &lt; −1, inelastic if −1 &lt; ε &lt; 0.',
    'Along a linear demand curve the elasticity varies: 0 at p = 0 and towards −∞ as Q → 0. Only Q = A·p<sup>ε</sup> has constant elasticity.',
    'Cross-price elasticity &gt; 0: substitutes. &lt; 0: complements. Income elasticity &lt; 0: inferior good.',
    'Positive analysis describes what happens. Normative analysis says what ought to happen.'
  ],
  qs: [
    {t:'num', ex:true, q:'Demand: Q = 100 − 10p. Supply: Q = 10p. What is the equilibrium quantity?', a:50, tol:0.01, e:'100 − 10p = 10p gives p = 5. Then Q = 10·5 = 50.'},
    {t:'num', ex:true, q:'Demand: Q = 400 − 20p. Supply: Q = 30 + 30p. What is the equilibrium price?', a:7.4, tol:0.01, e:'400 − 20p = 30 + 30p gives 370 = 50p, so p = 7.4.'},
    {t:'mc', ex:true, q:'The supply of pork is Q = 110 + 40p − 2p<sub>h</sub>, where p<sub>h</sub> is the price of hogs. What is the supply function when p<sub>h</sub> = 50?', o:['Q = 10 + 40p','Q = 110 + 40p','Q = 60 + 40p','Q = 10 − 2p'], a:0, e:'Plug in p<sub>h</sub> = 50: Q = 110 + 40p − 100 = 10 + 40p.'},
    {t:'mc', q:'What causes a <b>shift</b> in the demand curve for coffee (not a movement along it)?', o:['The price of tea rises','The price of coffee falls','Coffee producers get lower costs','The price of coffee rises because of a tax'], a:0, e:'The price of a substitute (tea) is a shift variable in the demand function. A change in coffee’s own price only moves along the curve.'},
    {t:'tf', ex:true, q:'Statement: Along a linear demand curve Q = a − bp the price elasticity is constant.', a:false, e:'False. ε = −b·p/Q. At p = 0, ε = 0, and as Q → 0, ε goes to −∞. The elasticity changes along the curve.'},
    {t:'num', q:'Demand: Q = 100 − 2p. What is the price elasticity at p = 20? (two decimals)', a:-0.67, tol:0.006, e:'Q = 100 − 40 = 60. ε = (dQ/dp)·(p/Q) = −2·20/60 = −0.67.'},
    {t:'mc', q:'Demand is Q = 5p<sup>−2</sup>. What is the price elasticity?', o:['−2 at all prices','−1 at all prices','It depends on p','−5'], a:0, e:'For Q = A·p<sup>ε</sup> the elasticity is constant and equal to the exponent, here −2.'},
    {t:'num', q:'Q = 1000 − 2p + 3p<sub>s</sub>, where p<sub>s</sub> is the price of another good. At p = 50 and p<sub>s</sub> = 100: what is the cross-price elasticity? (two decimals)', a:0.25, tol:0.006, e:'Q = 1000 − 100 + 300 = 1200. Cross-price elasticity = 3·100/1200 = 0.25.'},
    {t:'mc', q:'The cross-price elasticity between butter and margarine is positive. What does that mean?', o:['They are substitutes','They are complements','Both are inferior goods','Demand is inelastic'], a:0, e:'Positive cross-price elasticity: when the price of one rises, people buy more of the other. That is the mark of substitutes.'},
    {t:'mc', q:'A good has an income elasticity of −0.3. What kind of good is it?', o:['Inferior good','Luxury good','Necessity','Giffen good, always'], a:0, e:'Negative income elasticity means demand falls when income rises. That is the definition of an inferior good.'},
    {t:'mc', q:'Demand increases while the supply curve is unchanged and upward-sloping. What happens to the equilibrium?', o:['Both price and quantity rise','Price rises, quantity falls','Price falls, quantity rises','No change'], a:0, e:'The demand curve shifts out along an upward-sloping supply curve, so both p and Q rise.'},
    {t:'tf', ex:true, q:'Statement: The supply elasticity varies along a linear supply function Q = a + bp (with a ≠ 0).', a:true, e:'True. η = b·p/(a + bp), which changes with p. Only if the curve passes through the origin (a = 0) is η = 1 everywhere.'},
    {t:'mc', q:'Which statement is <b>normative</b>?', o:['The government should introduce a minimum wage','A minimum wage above the equilibrium wage creates excess supply of labor','A tax raises the price consumers pay','Demand for cigarettes is inelastic'], a:0, e:'Normative statements say what should be done. The others describe relationships that can be tested (positive analysis).'},
    {t:'mc', q:'Is demand typically more or less elastic in the long run than in the short run?', o:['More elastic in the long run','Less elastic in the long run','Always equally elastic','Elasticity is always −1 in the long run'], a:0, e:'Over time consumers find substitutes and adjust habits, so they respond more strongly to price changes.'}
  ]
},
{
  id: 'u2', title: 'Consumer Choice', ch: 'Ch. 3',
  theory: [
    'Preference axioms: completeness, transitivity and “more is better”. So indifference curves slope down, do not cross, and higher curves mean higher utility.',
    'MRS = −U<sub>x</sub>/U<sub>y</sub> (the slope of the indifference curve, x on the horizontal axis).',
    'Budget: p<sub>x</sub>x + p<sub>y</sub>y = Y. MRT = −p<sub>x</sub>/p<sub>y</sub> (the slope of the budget line).',
    'Interior optimum: MRS = MRT, i.e. U<sub>x</sub>/p<sub>x</sub> = U<sub>y</sub>/p<sub>y</sub>.',
    'Lagrangian: L = U(x,y) + λ(Y − p<sub>x</sub>x − p<sub>y</sub>y). λ is the marginal utility of income.',
    'Cobb-Douglas U = Ax<sup>a</sup>y<sup>1−a</sup> gives x = aY/p<sub>x</sub> and y = (1−a)Y/p<sub>y</sub>. The budget share of x is a.',
    'Perfect substitutes (U = x + y): straight indifference curves, corner solution on the cheaper good. Perfect complements (U = min(x,y)): L-shaped curves.'
  ],
  qs: [
    {t:'mc', ex:true, q:'Bundle B is 6 movies and 3 books. Bundle C is 2 movies and 7 books. No indifference curve passes through both. Compared with B, C gives …', o:['more, less or the same utility. We cannot know','more utility','less utility','the same utility'], a:0, e:'C has more books but fewer movies than B. Without information about the indifference curves we cannot rank them.'},
    {t:'mc', q:'F is 6 movies and 5 books. A is 2 movies and 3 books. What can we say?', o:['F is preferred to A','A is preferred to F','They give the same utility','We cannot know'], a:0, e:'F has more of both goods. With the assumption “more is better”, F is preferred.'},
    {t:'mc', q:'Why can two indifference curves for the same person not cross?', o:['It violates transitivity and “more is better”','Because the budget line is straight','Because MRS is always constant','Because the goods are normal'], a:0, e:'If the curves crossed, the crossing point would be as good as two bundles where one has more of everything. That contradicts transitivity and “more is better”.'},
    {t:'mc', ex:true, q:'Steve’s utility function is U = 4BC − 4 (B = burgers on the vertical axis, C = packs of cigarettes on the horizontal axis). What is the MRS?', o:['MRS = −B/C','MRS = BC','MRS = −4B/C − 4','MRS = −4B/C'], a:0, e:'MRS = −U<sub>C</sub>/U<sub>B</sub> = −4B/(4C) = −B/C. The constant −4 does not affect the derivatives.'},
    {t:'num', ex:true, q:'Income is 200 and p<sub>A</sub> = 2. MRT = −4 (4 units of B trade for 1 unit of A). What is the price of B?', a:0.5, tol:0.001, e:'MRT = −p<sub>A</sub>/p<sub>B</sub> = −4 gives p<sub>B</sub> = 2/4 = 0.5.'},
    {t:'num', ex:true, q:'Income is 220 and p<sub>Z</sub> = 7. MRT = −2 (2 units of Z trade for 1 unit of B). What is the price of B?', a:14, tol:0.001, e:'MRT = −p<sub>B</sub>/p<sub>Z</sub> = −2 gives p<sub>B</sub> = 2·7 = 14.'},
    {t:'mc', ex:true, q:'All prices and income double. What happens to the budget line?', o:['It does not change','It becomes flatter','It shifts outward','It becomes steeper'], a:0, e:'The intercepts Y/p<sub>x</sub> and Y/p<sub>y</sub> and the slope −p<sub>x</sub>/p<sub>y</sub> are unchanged when everything is multiplied by 2.'},
    {t:'mc', ex:true, q:'What do the indifference curves of U(x,y) = x + y look like?', o:['Straight lines with slope −1','L-shaped curves','Curves convex to the origin','Horizontal lines'], a:0, e:'U = x + y = k gives y = k − x. The goods are perfect substitutes and MRS = −1 everywhere.'},
    {t:'num', ex:true, q:'U(x,y) = x + y. Income 500, p<sub>x</sub> = 2.5, p<sub>y</sub> = 5. How many units of x are bought?', a:200, tol:0.01, e:'The goods are perfect substitutes with a 1:1 trade-off, so all income goes to the cheaper one: x = 500/2.5 = 200, y = 0.'},
    {t:'mc', ex:true, q:'U(x,y) = 8x<sup>0.4</sup>y<sup>0.6</sup>, income m. What is the demand for x?', o:['x = 2m/(5p<sub>x</sub>)','x = 3m/(5p<sub>x</sub>)','x = m/(2p<sub>x</sub>)','x = 8m/p<sub>x</sub>'], a:0, e:'From the Lagrangian: 2y/(3x) = p<sub>x</sub>/p<sub>y</sub>. Combined with the budget this gives x = 0.4m/p<sub>x</sub> = 2m/(5p<sub>x</sub>).'},
    {t:'mc', ex:true, q:'U = 10 + 2B<sup>0.2</sup>Z<sup>0.8</sup>, income Y. What is the demand for B?', o:['0.2Y/p<sub>B</sub>','0.4Y/p<sub>B</sub>','0.8Y/p<sub>B</sub>','0.2Y/p<sub>B</sub> + 10'], a:0, e:'The constant 10 and the factor 2 do not change the optimum. Cobb-Douglas with exponents 0.2 and 0.8 gives B = 0.2Y/p<sub>B</sub>.'},
    {t:'mc', q:'What is the condition for an interior utility maximum?', o:['U<sub>x</sub>/U<sub>y</sub> = p<sub>x</sub>/p<sub>y</sub>','U<sub>x</sub> = U<sub>y</sub>','p<sub>x</sub>x = p<sub>y</sub>y','U<sub>x</sub>/p<sub>y</sub> = U<sub>y</sub>/p<sub>x</sub>'], a:0, e:'The indifference curve is tangent to the budget line: MRS = MRT, i.e. U<sub>x</sub>/U<sub>y</sub> = p<sub>x</sub>/p<sub>y</sub>.'},
    {t:'tf', ex:true, q:'Statement: A consumer maximizes utility by choosing the bundle on the <b>lowest</b> attainable indifference curve.', a:false, e:'False. The consumer chooses the <b>highest</b> indifference curve that can be reached within the budget, typically where the curve is tangent to the budget line.'},
    {t:'num', q:'U = min(x, y). Income 120, p<sub>x</sub> = 2, p<sub>y</sub> = 4. How much x is bought?', a:20, tol:0.01, e:'Perfect complements: x = y. Budget: 2x + 4x = 120 gives x = 20.'},
    {t:'mc', q:'How is λ interpreted in the Lagrangian L = U + λ(Y − p<sub>x</sub>x − p<sub>y</sub>y)?', o:['The marginal utility of one extra unit of income','The price of good x','The marginal rate of substitution','The budget share of x'], a:0, e:'λ = U<sub>x</sub>/p<sub>x</sub> = U<sub>y</sub>/p<sub>y</sub> and measures how much utility rises when the budget increases by one unit.'},
    {t:'num', ex:true, q:'U = 8x<sup>0.4</sup>y<sup>0.6</sup>. What is the budget share p<sub>x</sub>x/m of good x? (decimal)', a:0.4, tol:0.001, e:'With x = 0.4m/p<sub>x</sub>, p<sub>x</sub>x/m = 0.4. Y gets the share 0.6.'}
  ]
},
{
  id: 'u3', title: 'Applying Consumer Theory', ch: 'Ch. 4',
  theory: [
    'The price-consumption curve (PCC) shows the optimum as one price changes, holding income and other prices constant. It gives the demand curve.',
    'The income-consumption curve (ICC) shows the optimum as income changes with prices constant. It gives the Engel curve.',
    'Normal good: income elasticity &gt; 0. Luxury: &gt; 1. Inferior good: &lt; 0.',
    'The substitution effect holds <b>utility</b> constant and always moves opposite to the price change. The income effect captures the change in purchasing power.',
    'Giffen good: an inferior good whose income effect is so strong that it outweighs the substitution effect.',
    'The Slutsky equation in elasticities: ε = ε* − θξ (θ = budget share, ξ = income elasticity).',
    'Cobb-Douglas: price elasticity −1 and income elasticity 1.'
  ],
  qs: [
    {t:'mc', ex:true, q:'When we draw the price-consumption curve (PCC) for good X, what is held constant?', o:['Income','The price of X','The utility level','Consumption of Y'], a:0, e:'The PCC shows how the optimum changes as p<sub>X</sub> changes, with income and p<sub>Y</sub> constant.'},
    {t:'mc', q:'The income-consumption curve (ICC) shows the optimum when …', o:['income changes and prices are held constant','the price of X changes and income is held constant','utility is held constant','both prices change by the same amount'], a:0, e:'The ICC traces the optimal bundles as the budget line shifts outward in parallel.'},
    {t:'mc', ex:true, q:'As income rises, the ICC shows that consumption of X <b>falls</b> while consumption of Y rises. What can we say?', o:['X is inferior, Y is normal','X is normal, Y is inferior','Both are normal goods','Both are inferior goods'], a:0, e:'A good whose consumption falls when income rises is inferior.'},
    {t:'mc', ex:true, q:'The substitution effect shows the change in consumption when relative prices change, while we hold … constant.', o:['utility','prices','consumption','utility, prices and consumption'], a:0, e:'The substitution effect is the movement along the original indifference curve: utility is held constant.'},
    {t:'mc', q:'The price of a good rises. What always holds for the substitution effect on that good?', o:['It reduces (or does not increase) the quantity demanded','It increases the quantity demanded','It is zero for normal goods','It has the same sign as the income effect'], a:0, e:'With convex preferences the substitution effect always works opposite to the price change.'},
    {t:'tf', ex:true, q:'Statement: When the price of a tablet rises, both the income and substitution effects must be negative for <b>all</b> consumers.', a:false, e:'False. The substitution effect is always negative, but for a consumer who sees the tablet as an inferior good the income effect pulls the other way.'},
    {t:'mc', q:'What characterizes a Giffen good?', o:['An inferior good whose income effect is larger than its substitution effect','A normal good with a large substitution effect','A luxury good with high income elasticity','A good with perfect substitutes'], a:0, e:'When the price rises, the strong income effect makes consumption increase. The demand curve slopes upward.'},
    {t:'num', ex:true, q:'U = 8x<sup>0.4</sup>y<sup>0.6</sup>. What is the price elasticity of good x?', a:-1, tol:0.001, e:'x = 0.4m/p<sub>x</sub>. dx/dp<sub>x</sub>·p<sub>x</sub>/x = −0.4m/p<sub>x</sub><sup>2</sup> · p<sub>x</sub>/(0.4m/p<sub>x</sub>) = −1.'},
    {t:'num', ex:true, q:'U = 8x<sup>0.4</sup>y<sup>0.6</sup>. What is the income elasticity of good x?', a:1, tol:0.001, e:'dx/dm·m/x = (0.4/p<sub>x</sub>)·m/(0.4m/p<sub>x</sub>) = 1.'},
    {t:'mc', ex:true, q:'Jane has Cobb-Douglas utility. The price of good 1 rises while p<sub>2</sub> and income are unchanged. What does the PCC look like (good 2 on the vertical axis)?', o:['Horizontal: consumption of good 2 does not change','Vertical','Upward-sloping','Downward-sloping'], a:0, e:'With Cobb-Douglas, y = (1−a)Y/p<sub>2</sub>, independent of p<sub>1</sub>. So the PCC is horizontal.'},
    {t:'num', q:'U = x<sup>0.4</sup>y<sup>0.6</sup>, income 1000 and p<sub>x</sub> = 10. How much x is demanded?', a:40, tol:0.01, e:'x = 0.4·1000/10 = 40.'},
    {t:'mc', q:'A good has an income elasticity of 1.8. What kind of good is it?', o:['Luxury good','Necessity','Inferior good','Giffen good'], a:0, e:'Income elasticity above 1 means the budget share rises with income: a luxury good.'},
    {t:'mc', q:'What does an Engel curve show?', o:['The relationship between income and quantity demanded','The relationship between price and quantity','Bundles with equal utility','Bundles with equal cost'], a:0, e:'The Engel curve has income on the vertical axis and quantity on the horizontal axis. It is derived from the ICC.'}
  ]
},
{
  id: 'u4', title: 'Welfare and Labor Supply', ch: 'Ch. 5',
  theory: [
    'Consumer surplus (CS): the area under the demand curve and above the price. For a linear curve: ½·base·height.',
    'Compensating variation (CV): the amount that must be given after a price increase to reach the original utility.',
    'Equivalent variation (EV): the amount the consumer would give up before the price increase to suffer the same utility loss.',
    'Normal good, price increase: |CV| &gt; |CS| &gt; |EV|. Inferior good: the reverse. No income effect (quasilinear utility): CV = CS = EV.',
    'Labor supply: leisure N = 24 − H, income Y = wH. A wage increase makes leisure more expensive (substitution effect: work more) but raises income (income effect: more leisure if leisure is normal). The supply curve can bend backward.'
  ],
  qs: [
    {t:'num', ex:true, q:'Inverse demand: p = 80 − 2Q. The market price is 10. What is consumer surplus?', a:1225, tol:0.5, e:'10 = 80 − 2Q gives Q = 35. CS = ½·35·(80 − 10) = 1225.'},
    {t:'num', ex:true, q:'Inverse demand for pineapples: p = 75 − 2q. The price is 25. What is consumer surplus?', a:625, tol:0.5, e:'25 = 75 − 2q gives q = 25. CS = ½·25·(75 − 25) = 625.'},
    {t:'num', ex:true, q:'p = 80 − 2Q. Subsidies make the price fall from 40 to 10. How much does consumer surplus increase?', a:825, tol:0.5, e:'At p = 40: Q = 20, CS = ½·20·40 = 400. At p = 10: Q = 35, CS = 1225. Increase: 825.'},
    {t:'mc', q:'What is the compensating variation (CV) of a price increase?', o:['The amount the consumer must receive after the price increase to be as well off as before','The amount the consumer would pay to avoid the price increase, measured before it happens','The change in consumer surplus','The change in spending on the good'], a:0, e:'CV is measured at the new prices and brings the consumer back to the original utility level.'},
    {t:'mc', ex:true, q:'For a price increase, typically |EV| &gt; |CS| &gt; |CV| when the good is …', o:['an inferior good','a normal good','a luxury good','a Giffen good, but not inferior'], a:0, e:'For normal goods the order is |CV| &gt; |CS| &gt; |EV|. The sign of the income effect reverses it for inferior goods.'},
    {t:'mc', q:'When are CV, CS and EV equal?', o:['When there is no income effect (quasilinear utility)','When the good is inferior','When demand is perfectly elastic','Never'], a:0, e:'The differences are due to the income effect. Without it the three measures are identical.'},
    {t:'tf', ex:true, q:'Statement: In the labor supply model, a wage increase does not always lead the worker to work more.', a:true, e:'True. If leisure is a normal good, the income effect (more leisure) can dominate the substitution effect (work more). Then the labor supply curve bends backward.'},
    {t:'mc', ex:true, q:'Julia freely chose to work 10 hours per day. Now she may work at most 8 hours. She is then …', o:['worse off, because she is prevented from working as much as she wants','equally well off','better off, because she does not have to work as much','worse off, because she is no longer rational'], a:0, e:'10 hours was her optimum. A binding constraint forces her to a point on a lower indifference curve.'},
    {t:'num', ex:true, q:'Silje has U(N,Y) = Y<sup>0.5</sup> + 2N, where Y = wH, w = 64 and N = 24 − H. How many hours H does she work?', a:4, tol:0.01, e:'U = (64H)<sup>0.5</sup> + 2(24 − H). dU/dH = 4/√H − 2 = 0 gives √H = 2, so H = 4.'},
    {t:'tf', ex:true, q:'Statement: Students who get 500 in cash instead of a 500 gift card for books are at least as well off.', a:true, e:'True. Cash gives a budget set that includes everything the gift card offers. They are strictly better off if they would have spent less than 500 on books.'},
    {t:'mc', q:'The wage rises and leisure is a normal good. Which way does the income effect pull?', o:['Towards more leisure and fewer hours worked','Towards less leisure and more hours worked','It has no effect','Towards a higher wage'], a:0, e:'Higher income raises demand for normal goods, including leisure. That pulls towards fewer hours.'}
  ]
},
{
  id: 'u5', title: 'Production', ch: 'Ch. 6',
  theory: [
    'Marginal product: MP<sub>L</sub> = ∂q/∂L. Average product: AP<sub>L</sub> = q/L. MP<sub>L</sub> = AP<sub>L</sub> where AP<sub>L</sub> is at its maximum.',
    'Diminishing marginal returns: MP<sub>L</sub> falls as L increases with K fixed.',
    'MRTS = −MP<sub>L</sub>/MP<sub>K</sub> (the slope of the isoquant with L on the horizontal axis).',
    'Returns to scale for q = AK<sup>a</sup>L<sup>b</sup>: a + b &gt; 1 increasing, = 1 constant, &lt; 1 decreasing.',
    'Constant returns to scale and diminishing marginal returns can hold at the same time, e.g. 7K<sup>0.5</sup>L<sup>0.5</sup>.',
    'Perfect substitutes in production (q = 2L + 5K) give straight isoquants.'
  ],
  qs: [
    {t:'num', q:'The production function is q = 5KL. How much is produced with L = 10 and K = 10?', a:500, tol:0.01, e:'q = 5·10·10 = 500.'},
    {t:'mc', ex:true, q:'Can a production function have constant returns to scale and at the same time diminishing marginal returns to both inputs?', o:['Yes, for example f(K,L) = 7K<sup>0.5</sup>L<sup>0.5</sup>','No','Yes, for example f(K,L) = 10KL','Yes, for example f(K,L) = K<sup>0.4</sup>L<sup>0.8</sup>'], a:0, e:'The exponents sum to 1 (constant returns to scale), and each is below 1, so the marginal products fall.'},
    {t:'mc', ex:true, q:'f(K,L) = 8L<sup>0.1</sup>K<sup>0.7</sup>. This function has …', o:['decreasing returns to scale and diminishing marginal returns to both inputs','constant returns to scale and diminishing marginal returns','decreasing returns to scale and increasing marginal returns','constant returns to scale and constant marginal returns'], a:0, e:'0.1 + 0.7 = 0.8 &lt; 1 gives decreasing returns to scale. Each exponent is below 1, so the marginal products diminish.'},
    {t:'mc', ex:true, q:'In the short run K = 4 is fixed and f = 4L<sup>0.7</sup>. The firm has …', o:['diminishing marginal returns to labor','increasing marginal returns to capital','constant marginal returns to labor','increasing marginal returns to labor'], a:0, e:'MP<sub>L</sub> = 2.8L<sup>−0.3</sup>, which falls as L increases.'},
    {t:'mc', q:'What is the MRTS (L on the horizontal axis)?', o:['−MP<sub>L</sub>/MP<sub>K</sub>','−MP<sub>K</sub>/MP<sub>L</sub>','−w/r always','MP<sub>L</sub>·MP<sub>K</sub>'], a:0, e:'Along an isoquant MP<sub>L</sub>dL + MP<sub>K</sub>dK = 0, so dK/dL = −MP<sub>L</sub>/MP<sub>K</sub>.'},
    {t:'num', ex:true, q:'Norwegian Apples: q = 100KL + 100L. What is MP<sub>L</sub> when K = 10?', a:1100, tol:0.01, e:'MP<sub>L</sub> = ∂q/∂L = 100K + 100 = 1100.'},
    {t:'mc', ex:true, q:'q = 100KL + 100L. What is the MRTS?', o:['−(K + 1)/L','−L/(K + 1)','−K/L','−100'], a:0, e:'MP<sub>L</sub> = 100(K + 1), MP<sub>K</sub> = 100L. MRTS = −(K + 1)/L.'},
    {t:'mc', ex:true, q:'q = 100KL + 100L. Does the isoquant for q = 90,000 hit the axes?', o:['It hits the L axis (K = 0, L = 900) but not the K axis','It hits both axes','It hits the K axis but not the L axis','It hits neither axis'], a:0, e:'With K = 0, q = 100L, so L = 900. With L = 0, q = 0 regardless of K, so the isoquant never reaches the K axis.'},
    {t:'mc', q:'q = AK<sup>0.6</sup>L<sup>0.6</sup>. Which returns to scale?', o:['Increasing','Constant','Decreasing','Cannot be determined'], a:0, e:'0.6 + 0.6 = 1.2 &gt; 1.'},
    {t:'mc', q:'q = 2L + 5K. What do the isoquants look like?', o:['Straight lines: the inputs are perfect substitutes','L-shaped','Convex to the origin','Vertical'], a:0, e:'MRTS = −2/5 is constant, so the isoquants are straight lines.'},
    {t:'mc', q:'When is MP<sub>L</sub> = AP<sub>L</sub>?', o:['Where AP<sub>L</sub> is at its maximum','Where MP<sub>L</sub> is at its maximum','Where output is at its maximum','Never'], a:0, e:'When the marginal product is above the average, it pulls the average up. They are equal where AP<sub>L</sub> peaks.'},
    {t:'num', q:'q = 2K<sup>0.4</sup>L<sup>0.8</sup>. Both inputs are doubled. By what factor does output increase? (two decimals)', a:2.30, tol:0.006, e:'q increases by 2<sup>0.4+0.8</sup> = 2<sup>1.2</sup> ≈ 2.30.'}
  ]
},
{
  id: 'u6', title: 'Costs', ch: 'Ch. 7',
  theory: [
    'Explicit costs are direct payments. Implicit costs are opportunity costs. Economic cost = both.',
    'C(q) = F + VC(q). AC = C/q, AVC = VC/q, AFC = F/q, MC = dC/dq.',
    'MC crosses AC and AVC at their minimum points.',
    'Cost minimization: MP<sub>L</sub>/w = MP<sub>K</sub>/r, i.e. MRTS = −w/r. Isocost line: C = wL + rK.',
    'Short run with fixed K: solve the production function for L and plug into C = wL + rK̄.',
    'Sunk costs are irrelevant for future decisions. Economies of scale: AC falls as q increases.'
  ],
  qs: [
    {t:'mc', ex:true, q:'What is the difference between explicit and implicit costs?', o:['Explicit costs are direct payments, implicit costs are opportunity costs','Implicit costs include contractual payments','Implicit costs must be paid now, explicit ones in the long run','There is no real difference'], a:0, e:'Explicit costs are cash outlays. Implicit costs are the value of the best alternative you give up, for example your own working time.'},
    {t:'mc', ex:true, q:'C(q) = 1000 + 10q + q<sup>2</sup>. What is AVC?', o:['10 + q','1000/q + 10 + q','10 + 2q','1000 + 10q'], a:0, e:'VC = 10q + q<sup>2</sup>. AVC = VC/q = 10 + q. (10 + 2q is MC.)'},
    {t:'mc', ex:true, q:'C = 0.5q<sup>2</sup> + 500. At which positive q is AC at its minimum?', o:['q = 10√10','q = 5√10','q = 30√10','q = 20√10'], a:0, e:'AC = 0.5q + 500/q. AC′ = 0.5 − 500/q<sup>2</sup> = 0 gives q<sup>2</sup> = 1000, q = 10√10 ≈ 31.6.'},
    {t:'num', q:'C = 0.5q<sup>2</sup> + 500. What is MC at q = 20?', a:20, tol:0.01, e:'MC = dC/dq = q = 20.'},
    {t:'mc', q:'Where does the MC curve cross the AC curve?', o:['At the minimum of AC','At the maximum of AC','Where AC = AFC','Never'], a:0, e:'When MC &lt; AC, AC is pulled down, and when MC &gt; AC, AC is pulled up. So they cross at the minimum of AC.'},
    {t:'mc', ex:true, q:'Covmed: f = 2√L in the short run (K = 100 fixed), r = 8, w = 20. What is the cost function?', o:['C(q) = 800 + 5q<sup>2</sup>','C(q) = 800 + 20q','C(q) = 100 + 5q<sup>2</sup>','C(q) = 800 + 10q<sup>2</sup>'], a:0, e:'q = 2√L gives L = q<sup>2</sup>/4. C = rK + wL = 8·100 + 20·q<sup>2</sup>/4 = 800 + 5q<sup>2</sup>. FC = 800, VC = 5q<sup>2</sup>.'},
    {t:'mc', q:'What is the condition for cost minimization in the long run?', o:['MP<sub>L</sub>/w = MP<sub>K</sub>/r','MP<sub>L</sub> = MP<sub>K</sub>','w = r','MP<sub>L</sub>·w = MP<sub>K</sub>·r'], a:0, e:'The last dollar spent on each input should yield the same extra output. The isoquant is tangent to the isocost line.'},
    {t:'mc', ex:true, q:'q = 2L + 5K, w = 10, r = 20. What is the long-run cost function?', o:['C = 4q','C = 5q','C = 10q','C = 3q'], a:0, e:'Cost per unit using only L: w/2 = 5. Using only K: r/5 = 4. Use the cheaper one: C = 4q.'},
    {t:'num', ex:true, q:'Norwegian Apples: q = 100KL + 100L, r = 400, w = 100. How much capital K is used to produce 90,000 at the lowest cost?', a:14, tol:0.01, e:'MRTS = −(K+1)/L = −w/r = −1/4 gives L = 4(K+1). Then q = 400(K+1)<sup>2</sup> = 90,000, so K + 1 = 15, K = 14 and L = 60.'},
    {t:'num', ex:true, q:'Continued: What does it cost Norwegian Apples to produce q = 90,000 (K = 14, L = 60)?', a:11600, tol:0.5, e:'C = rK + wL = 400·14 + 100·60 = 5600 + 6000 = 11,600.'},
    {t:'mc', q:'How should a sunk cost affect the decision to keep producing?', o:['Not at all','It should be added to MC','It should be added to AVC','The firm must always cover it'], a:0, e:'A sunk cost cannot be recovered whatever you do. Only costs affected by the choice are relevant.'},
    {t:'mc', q:'What are economies of scope?', o:['It is cheaper to produce two goods together than separately','AC falls when one good is produced in larger quantities','MC is constant','Costs fall over time with experience'], a:0, e:'Economies of scope: C(q<sub>1</sub>, q<sub>2</sub>) &lt; C(q<sub>1</sub>, 0) + C(0, q<sub>2</sub>). The last option describes learning by doing.'}
  ]
},
{
  id: 'u7', title: 'Perfect Competition', ch: 'Ch. 8',
  theory: [
    'Price-taking firm: MR = p. Profit maximum: p = MC (where MC is rising).',
    'Short run: produce if p ≥ min AVC. The shutdown rule compares revenue with <b>variable</b> costs, not total costs.',
    'Short-run supply curve = the MC curve above min AVC.',
    'Long run: free entry and exit drive profit to zero and p = min AC.',
    'The Lerner index (p − MC)/p is 0 under perfect competition.',
    'A specific tax t raises MC by t: p = MC + t.'
  ],
  qs: [
    {t:'tf', ex:true, q:'Statement: A competitive producer maximizes profit where average variable cost is at its lowest.', a:false, e:'False. The first-order condition is p = MC. In addition revenue must cover variable costs: p ≥ AVC. Min AVC is just the shutdown point.'},
    {t:'mc', ex:true, q:'A price-taking firm in the short run produces (profit is higher than if it shut down) but makes a loss. What must hold?', o:['AC ≥ p ≥ AVC','MR &lt; MC','p &gt; MC','p &gt; AC ≥ AVC'], a:0, e:'A loss means p &lt; AC. Not shutting down means p ≥ AVC. The firm covers its variable costs and part of its fixed costs.'},
    {t:'num', ex:true, q:'Price 100, C = 0.008q<sup>3</sup> + 25q + 750, and a specific tax of 5 per unit. What is the optimal output? (integer)', a:54, tol:0.6, e:'MC + t = 0.024q<sup>2</sup> + 25 + 5 = 100 gives q<sup>2</sup> ≈ 2917 and q ≈ 54.'},
    {t:'mc', ex:true, q:'Why does economic profit go to zero in the long run in a competitive market?', o:['Free entry and exit','Differentiated products','Asymmetric information','Increasing returns to scale'], a:0, e:'Positive profit attracts new firms and supply rises until the price equals min AC.'},
    {t:'tf', ex:true, q:'Statement: In the short run the firm compares revenue with <b>total</b> costs when deciding whether to shut down.', a:false, e:'False. Fixed costs must be paid regardless. The firm shuts down only if revenue is below variable costs (p &lt; AVC).'},
    {t:'mc', ex:true, q:'What Lerner index do firms in perfect competition have?', o:['0','0.5','Infinite','1'], a:0, e:'p = MC gives (p − MC)/p = 0.'},
    {t:'num', q:'p = 40, C = 100 + q<sup>2</sup>. What is profit at the optimum?', a:300, tol:0.5, e:'MC = 2q = 40 gives q = 20. Profit = 40·20 − 100 − 400 = 300.'},
    {t:'mc', q:'What is a competitive firm’s short-run supply curve?', o:['The MC curve above the minimum of AVC','The MC curve above the minimum of AC','The whole AC curve','The AVC curve'], a:0, e:'The firm produces where p = MC as long as p ≥ min AVC. Below that it produces 0.'},
    {t:'num', q:'All firms have C = q<sup>2</sup> + 16. What is the market price in long-run equilibrium?', a:8, tol:0.01, e:'AC = q + 16/q has its minimum where 1 = 16/q<sup>2</sup>, i.e. q = 4. Min AC = 4 + 4 = 8, so p = 8.'},
    {t:'mc', q:'How does a specific tax of t per unit affect a competitive firm’s cost curves?', o:['MC and AC shift up by t','Only fixed costs increase','MC does not change','MC shifts down by t'], a:0, e:'Each unit costs t more, so MC, AVC and AC all shift up by t.'}
  ]
},
{
  id: 'u8', title: 'Welfare and Policy', ch: 'Ch. 9',
  theory: [
    'Welfare W = CS + PS. The competitive equilibrium maximizes W.',
    'Deadweight loss (DWL) arises when quantity deviates from equilibrium. With linear curves: ½·(price gap)·(quantity gap).',
    'Tax incidence: the price consumers pay rises by less than t, unless demand is perfectly inelastic.',
    'The more elastic demand (and supply), the larger the DWL of a tax.',
    'A price ceiling below equilibrium creates a shortage: Q = Q<sub>s</sub>(p̄).',
    'A tariff and a quota can give the same import quantity, but the tariff gives the government revenue. A quota gives that revenue to the license holders.'
  ],
  qs: [
    {t:'mc', ex:true, q:'Demand in market A is less elastic than in market B. Where does a specific tax likely cause the largest deadweight loss?', o:['Market B','Market A','No DWL, the government gets revenue','Equal'], a:0, e:'More elastic demand means a larger fall in quantity and thus a larger deadweight loss.'},
    {t:'num', ex:true, q:'Demand: Q = 140 − 10p. Supply: Q = 10p. A price ceiling of 3 is introduced. What is the deadweight loss?', a:160, tol:0.5, e:'Equilibrium: p = 7, Q = 70. At p = 3, 30 is supplied. The demand price at Q = 30 is 11. DWL = ½·(70 − 30)·(11 − 3) = 160.'},
    {t:'num', ex:true, q:'Q = 100 − 10p, supply Q = 10p. A price ceiling of 4 is introduced. By how much does consumer surplus change?', a:35, tol:0.5, e:'Without the ceiling: p = 5, Q = 50, CS = ½·50·5 = 125. With it: Q = 40, CS = ∫<sub>0</sub><sup>40</sup>(10 − Q/10 − 4)dQ = 240 − 80 = 160. Change: +35.'},
    {t:'tf', ex:true, q:'Statement: If a tax of t per unit is introduced, the market price rises by less than t.', a:true, e:'True, with one exception. Only if demand is perfectly inelastic (vertical) or supply perfectly elastic does the price rise by the full t.'},
    {t:'num', q:'Demand Q = 100 − p, supply Q = p. A tax of 10 per unit is levied on sellers. What price do consumers pay?', a:55, tol:0.01, e:'Sellers receive p − 10: 100 − p = p − 10 gives p = 55. Sellers get 45, Q = 45.'},
    {t:'num', q:'Same market: Q = 100 − p, Q = p, tax 10. What is the deadweight loss?', a:25, tol:0.01, e:'Q falls from 50 to 45. DWL = ½·10·5 = 25.'},
    {t:'tf', ex:true, q:'Statement: To reduce cheese imports, quotas are preferable to tariffs.', a:false, e:'False. A tariff and a quota with the same imports give the same price and DWL, but the tariff gives the government revenue. With a quota that gain goes to those holding import licenses.'},
    {t:'mc', q:'What happens when the government sets a price floor above the equilibrium price?', o:['Excess supply','Excess demand','The market clears anyway','The price falls'], a:0, e:'At a higher price, producers want to sell more than consumers want to buy.'},
    {t:'mc', q:'Which market outcome maximizes W = CS + PS (without externalities)?', o:['The competitive equilibrium where p = MC','The monopoly outcome','A price ceiling below equilibrium','Any quantity with positive profit'], a:0, e:'In equilibrium the willingness to pay for the last unit equals marginal cost. All mutually beneficial trades take place.'}
  ]
},
{
  id: 'u9', title: 'General Equilibrium', ch: 'Ch. 10',
  theory: [
    'Partial equilibrium looks at one market. General equilibrium takes into account that markets affect each other.',
    'Pareto efficient: nobody can be made better off without making someone worse off. A Pareto improvement makes at least one person better off without making anyone worse off.',
    'The Edgeworth box: the contract curve is all points where the indifference curves are tangent, i.e. MRS<sub>1</sub> = MRS<sub>2</sub>.',
    'First welfare theorem: a competitive equilibrium is Pareto efficient. Second: any Pareto efficient allocation can be reached by redistributing endowments.',
    'At wrong prices one person wants to buy more than the other wants to sell. The price of the good in excess demand must rise.'
  ],
  qs: [
    {t:'mc', q:'What is the contract curve in an Edgeworth box?', o:['All Pareto efficient allocations, where the MRS is equal for both','The budget line','All allocations better than the endowment for one person','The endowment'], a:0, e:'On the contract curve the indifference curves are tangent, so there are no trades that make both better off.'},
    {t:'mc', q:'What does it mean that an allocation is Pareto efficient?', o:['Nobody can be made better off without someone being made worse off','Everyone has the same amount','Total utility is maximized','Everyone is better off than initially'], a:0, e:'Pareto efficiency says nothing about fairness. A very unequal distribution can be efficient.'},
    {t:'mc', q:'What does the first welfare theorem say?', o:['The competitive equilibrium is Pareto efficient','All Pareto efficient allocations are fair','Monopoly is efficient','Redistribution always causes losses'], a:0, e:'In a competitive market everyone’s MRS equals the price ratio, so there are no remaining gains from trade.'},
    {t:'mc', ex:true, q:'Mara and Nils trade along a price line. At these prices Mara wants to buy 27 units of X, while Nils only wants to sell 18. Why is this not an equilibrium?', o:['Mara demands more X than Nils wants to supply, so the price of X must rise','Nils demands more X than Mara wants to supply','Mara demands more Y than Nils wants to supply','The allocations are not Pareto improvements'], a:0, e:'There is excess demand for X. The relative price of X must rise until desired purchases and sales are equal.'},
    {t:'mc', ex:true, q:'In an Edgeworth box we move from endowment A to R. R is on the same indifference curve for M, but on a higher one for N. Who gains?', o:['M’s utility is unchanged, N is better off','Both are better off','N is better off and M is worse off','M is worse off and N is better off'], a:0, e:'It is a Pareto improvement: one is better off and nobody is worse off.'},
    {t:'num', ex:true, q:'Two related markets. Q<sub>1</sub><sup>d</sup> = 10 − 2p<sub>1</sub> + p<sub>2</sub>, Q<sub>1</sub><sup>s</sup> = p<sub>1</sub>. Q<sub>2</sub><sup>d</sup> = 10 − 2p<sub>2</sub> + p<sub>1</sub>, Q<sub>2</sub><sup>s</sup> = p<sub>2</sub>. What is p<sub>1</sub> in equilibrium?', a:5, tol:0.01, e:'Market 1: 3p<sub>1</sub> − p<sub>2</sub> = 10. Market 2: 3p<sub>2</sub> − p<sub>1</sub> = 10. Solution: p<sub>1</sub> = p<sub>2</sub> = 5.'},
    {t:'tf', ex:true, q:'Statement: General-equilibrium analysis of minimum wages shows that significant unemployment need not arise.', a:true, e:'True. When the minimum wage covers only part of the labor market, those who lose their jobs move to uncovered sectors. There the wage falls instead.'},
    {t:'mc', q:'What holds for the MRS of two consumers in a competitive equilibrium?', o:['Both have MRS equal to the price ratio','MRS is always 1','The richer one has the higher MRS','MRS can differ'], a:0, e:'Both adjust so that MRS = −p<sub>x</sub>/p<sub>y</sub>, so the MRS is the same for everyone.'}
  ]
},
{
  id: 'u10', title: 'Monopoly', ch: 'Ch. 11',
  theory: [
    'The monopoly chooses MR = MC. With p = a − bQ, MR = a − 2bQ.',
    'Price with elasticity: p = MC/(1 + 1/ε). Lerner index: L = (p − MC)/p = −1/ε.',
    'The monopoly always produces in the elastic part of the demand curve (|ε| &gt; 1).',
    'p &gt; MC gives too little output and a deadweight loss. Welfare maximum: p = MC.',
    'A monopoly has no supply curve. Natural monopoly: one firm can serve the market most cheaply (falling AC).',
    'Specific tax with linear demand and constant MC: the price rises by t/2.'
  ],
  qs: [
    {t:'num', ex:true, q:'Monopoly: p = 20 − Q/1000 and C(Q) = 10 + Q. Which price maximizes profit?', a:10.5, tol:0.01, e:'MR = 20 − Q/500 = MC = 1 gives Q = 9500. p = 20 − 9.5 = 10.5.'},
    {t:'num', ex:true, q:'The San Francisco cable car: p = 10 − Q/1000 and C(Q) = 2Q. What is the profit-maximizing price?', a:6, tol:0.01, e:'MR = 10 − Q/500 = 2 gives Q = 4000. p = 10 − 4 = 6.'},
    {t:'num', ex:true, q:'A monopoly faces an elasticity of −5 at its optimum and MC = 10. What is the price?', a:12.5, tol:0.01, e:'p = MC/(1 + 1/ε) = 10/(1 − 0.2) = 12.5.'},
    {t:'num', ex:true, q:'Covmed is a monopolist: P = 1200 − Q and C = 800 + 5Q<sup>2</sup>. What price does Covmed charge?', a:1100, tol:0.5, e:'MR = 1200 − 2Q = MC = 10Q gives Q = 100. P = 1100.'},
    {t:'num', ex:true, q:'Continued: What is Covmed’s profit (Q = 100, P = 1100)?', a:59200, tol:0.5, e:'π = 1100·100 − 800 − 5·100<sup>2</sup> = 110,000 − 800 − 50,000 = 59,200.'},
    {t:'num', ex:true, q:'Covmed: P = 1200 − Q, MC = 10Q. Which quantity maximizes welfare? (one decimal)', a:109.1, tol:0.06, e:'Welfare maximum at P = MC: 1200 − Q = 10Q gives Q = 1200/11 ≈ 109.1.'},
    {t:'tf', ex:true, q:'Statement: The more elastic the demand a monopoly faces at its optimum, the closer the Lerner index is to zero.', a:true, e:'True. L = −1/ε. As |ε| → ∞, L → 0, as in perfect competition.'},
    {t:'mc', q:'Why does a monopoly never produce in the inelastic part of the demand curve?', o:['There MR is negative, so lower output raises revenue and lowers cost','There MC is negative','There the price is lowest','It always does'], a:0, e:'MR = p(1 + 1/ε) &lt; 0 when |ε| &lt; 1. Then profit rises by producing less.'},
    {t:'mc', q:'Why does monopoly cause a deadweight loss?', o:['The price is above MC, so output is too low','The monopoly has fixed costs that are too high','The monopoly produces too much','Consumers pay too little'], a:0, e:'Units where willingness to pay exceeds MC are not produced.'},
    {t:'tf', ex:true, q:'Statement: A monopoly with inverse demand P = A − bQ and constant MC gets more market power (Lerner index) when A increases.', a:true, e:'True. p = (A + c)/2 gives L = (A − c)/(A + c), which increases with A.'},

  qs: [
    {t:'mc', q:'What is a Nash equilibrium?', o:['A set of strategies where no one can gain by deviating unilaterally','An outcome where the sum of payoffs is largest','An outcome where everyone uses dominant strategies','A Pareto optimal outcome'], a:0, e:'Each player’s strategy is a best response to the others’ strategies.'},
    {t:'mc', ex:true, q:'You have found an equilibrium in dominant strategies in a simultaneous game. Then you know that it …', o:['must also be a Nash equilibrium','cannot be a Nash equilibrium','may or may not be a Nash equilibrium','is Nash only in mixed strategies'], a:0, e:'A dominant strategy is a best response to everything, including the opponent’s dominant strategy.'},

    {t:'num', ex:true, q:'Daniel first chooses hours h<sub>D</sub>, then Kjell chooses h<sub>K</sub>. Kjell’s utility: 14(h<sub>D</sub> + h<sub>K</sub>)<sup>0.5</sup> − h<sub>K</sub>. Daniel’s utility: 12(h<sub>D</sub> + h<sub>K</sub>)<sup>0.5</sup> − h<sub>D</sub>. How many hours does Kjell work in the subgame perfect equilibrium?', a:49, tol:0.01, e:'Kjell chooses h<sub>D</sub> + h<sub>K</sub> = 49 (7/√h = 1). Daniel knows the total will be 49 anyway, so he contributes 0. Kjell works 49 hours.'},
    {t:'mc', q:'What does Nash’s existence theorem say?', o:['Every finite game has at least one Nash equilibrium, possibly in mixed strategies','Every game has an equilibrium in pure strategies','Every game has a dominant strategy','The Nash equilibrium is always unique'], a:0, e:'Matching pennies has no equilibrium in pure strategies, but one in mixed strategies.'},
    {t:'mc', q:'When is a threat credible?', o:['When the one threatening gains from carrying it out when the situation arises','When it is said loudly enough','When it gives the opponent a low payoff','Always in simultaneous games'], a:0, e:'Non-credible threats are discarded by backward induction and are not part of a subgame perfect equilibrium.'}
